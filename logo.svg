<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.3"/>
      <stop offset="20%" stop-color="#ef4444"/>
      <stop offset="80%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="#0a0a0f"/>

  <!-- Subtle center glow -->
  <circle cx="100" cy="100" r="65" fill="url(#centerGlow)"/>

  <!-- Outer ring - thin accent -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#ef4444" stroke-width="0.5" opacity="0.15"/>

  <!-- Globe outline -->
  <circle cx="100" cy="100" r="58" fill="none" stroke="#e6e6e6" stroke-width="1.8" opacity="0.7"/>

  <!-- Globe grid - latitude lines -->
  <ellipse cx="100" cy="100" rx="58" ry="20" fill="none" stroke="#e6e6e6" stroke-width="0.7" opacity="0.2"/>
  <ellipse cx="100" cy="100" rx="58" ry="40" fill="none" stroke="#e6e6e6" stroke-width="0.7" opacity="0.15"/>

  <!-- Globe grid - meridian lines -->
  <line x1="100" y1="42" x2="100" y2="158" stroke="#e6e6e6" stroke-width="0.7" opacity="0.2"/>
  <ellipse cx="100" cy="100" rx="28" ry="58" fill="none" stroke="#e6e6e6" stroke-width="0.7" opacity="0.18"/>

  <!-- Pulse glow layer (behind) -->
  <polyline
    points="30,100 58,100 66,100 72,78 80,124 88,56 96,140 104,68 112,100 120,100 142,100 170,100"
    fill="none"
    stroke="#ef4444"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.15"
    filter="url(#softGlow)"
  />

  <!-- Pulse / heartbeat line — sharp -->
  <polyline
    points="30,100 58,100 66,100 72,78 80,124 88,56 96,140 104,68 112,100 120,100 142,100 170,100"
    fill="none"
    stroke="url(#pulseGrad)"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Center pulse dot -->
  <circle cx="92" cy="98" r="3" fill="#ef4444" opacity="0.8"/>
  <circle cx="92" cy="98" r="6" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.25"/>
</svg>
