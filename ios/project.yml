# XcodeGen spec — generate CrisisPulse.xcodeproj
#
# Install XcodeGen:    brew install xcodegen
# Generate project:    cd ios && xcodegen generate
# Open in Xcode:       open CrisisPulse.xcodeproj

name: CrisisPulse
options:
  bundleIdPrefix: org.crisispulse
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""    # ← fill in your Apple Developer Team ID
    GENERATE_INFOPLIST_FILE: NO

targets:
  CrisisPulse:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: CrisisPulse
        excludes:
          - "Resources/**/*.json"
      - path: CrisisPulse/Resources
        type: folder

    resources:
      - CrisisPulse/Resources/Assets.xcassets

    info:
      path: CrisisPulse/Info.plist
      properties:
        CFBundleDisplayName: Crisis Pulse
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "1"
        CFBundleLocalizations:
          - en
          - zh-Hans
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: Crisis Pulse uses your location only to position your marker on the world map and estimate the risk index for your area. Your location is never transmitted or stored.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.crisispulse.app
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        INFOPLIST_FILE: CrisisPulse/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO

    dependencies:
      # MapKit, CoreLocation, UserNotifications are all in the iOS SDK
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework
      - sdk: UserNotifications.framework

schemes:
  CrisisPulse:
    build:
      targets:
        CrisisPulse: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
