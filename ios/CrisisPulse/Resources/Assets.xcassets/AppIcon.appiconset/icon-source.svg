<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- App icon background — radial dark gradient, slight color cast for warmth -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1a1320"/>
      <stop offset="60%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#08080d"/>
    </radialGradient>

    <!-- Pulse line gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#dc2626" stop-opacity="0.15"/>
      <stop offset="20%"  stop-color="#ef4444"/>
      <stop offset="80%"  stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.15"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ef4444" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- ============ Full-bleed background (NO transparency for App Store) ============ -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>

  <!-- Subtle center glow -->
  <circle cx="512" cy="512" r="380" fill="url(#centerGlow)"/>

  <!-- Globe outline -->
  <circle cx="512" cy="512" r="320" fill="none" stroke="#e6e6e6" stroke-width="9" opacity="0.65"/>

  <!-- Latitude lines -->
  <ellipse cx="512" cy="512" rx="320" ry="110" fill="none" stroke="#e6e6e6" stroke-width="3.5" opacity="0.18"/>
  <ellipse cx="512" cy="512" rx="320" ry="220" fill="none" stroke="#e6e6e6" stroke-width="3.5" opacity="0.13"/>

  <!-- Meridians -->
  <line x1="512" y1="192" x2="512" y2="832" stroke="#e6e6e6" stroke-width="3.5" opacity="0.18"/>
  <ellipse cx="512" cy="512" rx="155" ry="320" fill="none" stroke="#e6e6e6" stroke-width="3.5" opacity="0.16"/>

  <!-- Pulse / heartbeat — soft glow layer behind -->
  <polyline
    points="100,512 280,512 320,512 360,400 400,640 450,290 500,720 550,360 600,512 660,512 760,512 924,512"
    fill="none"
    stroke="#ef4444"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.22"
    filter="url(#softGlow)"
  />

  <!-- Sharp pulse line -->
  <polyline
    points="100,512 280,512 320,512 360,400 400,640 450,290 500,720 550,360 600,512 660,512 760,512 924,512"
    fill="none"
    stroke="url(#pulseGrad)"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Pulse epicenter dots -->
  <circle cx="450" cy="290" r="20" fill="#ef4444" opacity="0.95"/>
  <circle cx="450" cy="290" r="36" fill="none" stroke="#ef4444" stroke-width="6" opacity="0.4"/>
  <circle cx="450" cy="290" r="56" fill="none" stroke="#ef4444" stroke-width="3" opacity="0.2"/>
</svg>
