<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Crisis Monitor & Family Emergency Supply Calculator | Crisis Pulse</title>
<meta name="description" content="Analyze global conflict situations and generate personalized family emergency supply lists based on your location and family parameters.">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<style>*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#1a1a1a;background:#0a0a0f;line-height:1.6;-webkit-font-smoothing:antialiased}

/* ====== LANGUAGE SWITCHER ====== */
.lang-switcher{position:fixed;top:12px;right:16px;z-index:200;display:flex;gap:2px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:3px;backdrop-filter:blur(8px)}
.lang-btn{padding:5px 10px;border:none;border-radius:8px;font-size:12px;cursor:pointer;background:transparent;color:#888;transition:all .2s;font-weight:500;white-space:nowrap}
.lang-btn.active{background:rgba(255,255,255,.15);color:#fff;font-weight:600}
.lang-btn:hover:not(.active){color:#ccc}
/* Calculator page lang switcher override */
.calc-page-mode.lang-switcher{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.1)}
.calc-page-mode.lang-btn{color:#999}
.calc-page-mode.lang-btn.active{background:rgba(0,0,0,.08);color:#333}
.calc-page-mode.lang-btn:hover:not(.active){color:#666}

/* ====== PAGE: MAP ====== */
.map-page{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#0a0a0f 0%,#0d1117 50%,#0a0a0f 100%)}
.map-header{text-align:center;padding:24px 16px 8px}
.map-header h1{font-size:22px;font-weight:700;color:#e6e6e6;letter-spacing:1px}
.map-header .subtitle{font-size:12px;color:#666;margin-top:4px}
.map-header .live-tag{display:inline-block;font-size:10px;color:#ef4444;background:rgba(239,68,68,.12);padding:2px 10px;border-radius:10px;margin-top:8px;animation:pulse-tag 2s infinite}
@keyframes pulse-tag{0%,100%{opacity:1}50%{opacity:.5}}

.map-container{flex:1;display:flex;align-items:center;justify-content:center;padding:0 8px;position:relative;min-height:380px}
#worldMap{width:100%;max-width:960px}
#worldMap svg{width:100%;height:auto}

.map-legend{display:flex;justify-content:center;gap:16px;padding:8px 16px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#888}
.legend-dot{width:10px;height:10px;border-radius:50%}

.risk-panel{max-width:600px;margin:0 auto;padding:16px}
.risk-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:20px;text-align:center}
.risk-label{font-size:12px;color:#888;margin-bottom:4px}
.risk-score{font-size:48px;font-weight:800;margin:4px 0}
.risk-desc{font-size:13px;color:#aaa;margin-bottom:16px;line-height:1.6}
.risk-factors{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:16px}
.risk-factor{font-size:11px;padding:3px 10px;border-radius:8px;background:rgba(255,255,255,.06);color:#ccc}
.gps-status{font-size:11px;color:#555;margin-bottom:12px}
.gps-status .pin{color:#22c55e}
.btn-enter{display:block;width:100%;max-width:360px;margin:0 auto;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;color:#fff}
.btn-enter:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,0,0,.3)}

/* Conflict tooltip */
.conflict-tooltip{position:fixed;pointer-events:none;background:rgba(15,15,20,.92);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 14px;font-size:12px;color:#ddd;max-width:240px;z-index:100;opacity:0;transition:opacity .15s}
.conflict-tooltip .ct-name{font-weight:700;font-size:13px;margin-bottom:3px}
.conflict-tooltip .ct-level{font-size:11px;margin-bottom:2px}
.conflict-tooltip .ct-desc{font-size:11px;color:#999}

/* Hotspot marker */
.hotspot-marker{cursor:pointer}
.hotspot-ring{animation:ring-pulse 2.5s infinite}
@keyframes ring-pulse{0%{opacity:.7;r:6}50%{opacity:.2;r:14}100%{opacity:.7;r:6}}

/* User location marker */
.user-marker{filter:drop-shadow(0 0 6px rgba(34,197,94,.6))}

/* ====== PAGE: CALCULATOR ====== */
.calc-page{display:none;background:#f8f8f6;min-height:100vh}
.app{max-width:680px;margin:0 auto;padding:16px}
h1{font-size:20px;font-weight:700;margin-bottom:4px}
h2{font-size:16px;font-weight:600;margin:0 0 8px}
.subtitle{font-size:12px;color:#888;margin-bottom:20px}
.section{background:#fff;border-radius:12px;border:1px solid #e8e8e4;margin-bottom:16px;overflow:hidden}
.section-header{padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0f0ec}
.section-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.s-red .section-num{background:#fde8e8;color:#c53030}
.s-amber .section-num{background:#fef3c7;color:#b45309}
.s-blue .section-num{background:#dbeafe;color:#1d4ed8}
.s-green .section-num{background:#dcfce7;color:#15803d}
.section-body{padding:14px 16px}
.field-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.field-row label{font-size:12px;color:#666;min-width:50px}
input[type=text],input[type=number],select{padding:7px 10px;border:1px solid #ddd;border-radius:8px;font-size:13px;background:#fff;color:#1a1a1a;outline:none;transition:border .2s}
input:focus,select:focus{border-color:#3b82f6}
input[type=number]{width:64px;text-align:center}
select{cursor:pointer}
.member-grid{display:grid;grid-template-columns:1fr 60px 64px 70px 90px 30px;gap:5px;align-items:center;margin-bottom:6px;font-size:13px}
.member-labels{font-size:11px;color:#999;padding-bottom:4px}
.btn{padding:8px 16px;border:1px solid #ddd;border-radius:8px;background:#fff;font-size:13px;cursor:pointer;transition:all .15s}
.btn:hover{background:#f5f5f3;border-color:#ccc}
.btn:active{transform:scale(.98)}
.btn-primary{background:#1d4ed8;color:#fff;border:none;font-weight:600;width:100%;padding:12px;font-size:15px;border-radius:10px}
.btn-primary:hover{background:#1e40af}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-danger{color:#dc2626;border-color:#fca5a5}
.btn-danger:hover{background:#fef2f2}
.radio-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:500px){.radio-grid{grid-template-columns:1fr}.member-grid{grid-template-columns:1fr 50px 54px 60px 80px 26px;gap:3px}}
.radio-card{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:10px;border:1.5px solid #e8e8e4;background:#fff;cursor:pointer;transition:border .2s}
.radio-card.active{border-color:#3b82f6;background:#eff6ff}
.radio-card input{margin-top:3px}
.radio-card .rc-title{font-size:13px;font-weight:600}
.radio-card .rc-desc{font-size:11px;color:#888}
.inline-fields{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.inline-field{display:flex;align-items:center;gap:6px;font-size:13px}
.inline-field label{color:#666;white-space:nowrap}

/* Risk banner in calculator */
.risk-banner{background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;color:#fff}
.risk-banner .rb-score{font-size:28px;font-weight:800;min-width:50px;text-align:center}
.risk-banner .rb-text{font-size:12px;color:#aaa;line-height:1.5}
.risk-banner .rb-text strong{color:#e6e6e6;font-size:13px}
.risk-banner .rb-back{margin-left:auto;font-size:11px;color:#666;cursor:pointer;white-space:nowrap;padding:6px 12px;border:1px solid #333;border-radius:8px;background:transparent;transition:all .2s}
.risk-banner .rb-back:hover{border-color:#555;color:#aaa}

/* Results */
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
@media(max-width:500px){.summary-grid{grid-template-columns:repeat(2,1fr)}}
.summary-card{background:#f8f8f6;border-radius:10px;padding:10px 12px}
.summary-card .sc-label{font-size:11px;color:#888}
.summary-card .sc-value{font-size:20px;font-weight:700;margin:2px 0}
.summary-card .sc-sub{font-size:11px;color:#aaa}
.member-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.member-tag{font-size:12px;padding:3px 10px;border-radius:8px;background:#f0f0ec}
.member-tag.pet{background:#fef3c7}
.tier-section{margin-bottom:16px}
.tier-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tier-tag{font-size:11px;font-weight:600;padding:3px 10px;border-radius:6px}
.tier-tag.red{background:#fde8e8;color:#c53030}
.tier-tag.amber{background:#fef3c7;color:#b45309}
.tier-tag.blue{background:#dbeafe;color:#1d4ed8}
.tier-total{font-size:14px;font-weight:700}
.item-table{width:100%;border-collapse:collapse;font-size:12px;border:1px solid #e8e8e4;border-radius:10px;overflow:hidden}
.item-table thead{background:#f8f8f6}
.item-table th{padding:7px 10px;text-align:left;font-weight:500;font-size:11px;color:#888}
.item-table th:nth-child(2){text-align:center;width:80px}
.item-table th:nth-child(3){text-align:right;width:60px}
.item-table td{padding:6px 10px;border-top:1px solid #f0f0ec}
.item-table td:nth-child(2){text-align:center;color:#888}
.item-table td:nth-child(3){text-align:right;font-weight:600}
.item-table td:nth-child(4){color:#aaa;font-size:11px}
.grand-total{background:#fff;border-radius:12px;border:1px solid #e8e8e4;padding:14px 16px;margin-top:12px}
.gt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:13px}
.gt-label{color:#888;font-size:11px}
.gt-value{font-weight:700}
.gt-highlight{font-size:18px;color:#c53030}
.notes{margin-top:12px;padding:12px 14px;border-radius:10px;background:#fff;border:1px solid #e8e8e4;font-size:12px;color:#888;line-height:1.8}
.back-btn{width:100%;padding:10px;font-size:14px;margin-top:12px}
.footer{text-align:center;padding:20px 0 10px;font-size:11px;color:#bbb}
.footer a{color:#999;text-decoration:none}

/* Page transition */
.fade-out{animation:fadeOut .4s forwards}
.fade-in{animation:fadeIn .4s forwards}
@keyframes fadeOut{to{opacity:0;transform:translateY(-10px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Data source footer */
.data-source{text-align:center;padding:8px 16px 20px;font-size:10px;color:#444}
.data-source a{color:#555;text-decoration:none}

/* Humanistic message */
.humanistic-message{margin-bottom:12px;padding:12px 14px;background:rgba(255,255,255,.05);border-left:3px solid rgba(255,255,255,.2);border-radius:6px;font-size:13px;color:#aaa;line-height:1.6;font-style:italic}
</style>
</head>
<body>

<!-- ====== LANGUAGE SWITCHER ====== -->
<div class="lang-switcher" id="langSwitcher">

  <button class="lang-btn" data-lang="zh-CN">简中</button>
  <button class="lang-btn" data-lang="zh-TW">繁中</button>
  <button class="lang-btn" data-lang="ja">日本語</button>
</div>

<!-- ====== MAP PAGE ====== -->
<div class="map-page" id="mapPage">
  <div class="map-header">
    <h1 id="mapTitle"></h1>
    <div class="subtitle" id="mapSubtitle"></div>
    <div class="live-tag" id="liveTag"></div>
  </div>

  <div class="map-container">
    <div id="worldMap"></div>
    <div class="conflict-tooltip" id="tooltip"></div>

  <div class="map-legend" id="mapLegend"></div>

  <div class="risk-panel">
    <div class="risk-card">
      <div class="humanistic-message" id="humanMsg"></div>
      <div class="risk-label" id="riskLabel"></div>
      <div class="risk-score" id="riskScore" style="color:#fbbf24">—</div>
      <div class="risk-desc" id="riskDesc"></div>
      <div class="gps-status" id="gpsStatus"></div>
      <div class="risk-factors" id="riskFactors"></div>
      <button class="btn-enter" id="enterCalcBtn" style="background:linear-gradient(135deg,#dc2626,#991b1b);display:none" onclick="enterCalculator()"></button>
    </div>
  </div>

  <div class="data-source" id="dataSource"></div>
</div>

<!-- ====== CALCULATOR PAGE ====== -->
<div class="calc-page" id="calcPage">
  <div class="app" id="app"></div>
</div>

function t(key) {
  const entry = I18N[key];
  if (!entry) return key;
  return entry[currentLang] || entry.en || key;
}

function tf(key, ...args) {
  const entry = I18N[key];
  if (!entry) return key;
  const fn = entry[currentLang] || entry.en;
  if (typeof fn === 'function') return fn(...args);
  return fn || key;
}

// ====== LANGUAGE SWITCHER ======
function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('crisis-pulse-lang', lang);
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));

  const titles = { en:"Global Crisis Monitor & Family Emergency Supply Calculator | Crisis Pulse", "zh-CN":"全球危机态势 & 家庭应急储备计算器 | Crisis Pulse", "zh-TW":"全球危機態勢 & 家庭應急儲備計算器 | Crisis Pulse", ja:"世界危機モニター & 家庭防災備蓄計算機 | Crisis Pulse" };
  document.title = titles[lang] || titles.en;
  document.documentElement.lang = lang === 'zh-CN' ? 'zh-Hans' : lang === 'zh-TW' ? 'zh-Hant' : lang;

  document.getElementById('mapTitle').textContent = t('mapTitle');
  document.getElementById('mapSubtitle').textContent = t('mapSubtitle');

function intensityColor(i) {
  if (i >= 9) return "#991b1b";
  if (i >= 7) return "#ef4444";
  if (i >= 5) return "#f97316";
  if (i >= 3) return "#fbbf24";
  return "#4ade80";
}

function countryFillColor(name) {
  const risk = COUNTRY_RISK[name];
  if (!risk) return "rgba(34,197,94,0.04)";
  const alpha = Math.min(risk / 10, 1);
  if (risk >= 8) return `rgba(153,27,27,${alpha * 0.7})`;
  if (risk >= 6) return `rgba(239,68,68,${alpha * 0.5})`;
  if (risk >= 4) return `rgba(249,115,22,${alpha * 0.35})`;
  if (risk >= 2) return `rgba(251,191,36,${alpha * 0.2})`;
  return "rgba(34,197,94,0.04)";
}

function countryStrokeColor(name) {
  const risk = COUNTRY_RISK[name];
  if (!risk) return "rgba(34,197,94,0.35)";
  if (risk >= 7) return "rgba(239,68,68,0.25)";
  if (risk >= 4) return "rgba(249,115,22,0.18)";
  return "rgba(251,191,36,0.12)";
}

function countryStrokeWidth(name) {
  return COUNTRY_RISK[name] ? 0.5 : 0.8;
}

  const worldUrl = "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json";

  d3.json(worldUrl).then(world => {
    const countries = topojson.feature(world, world.objects.countries);

    svg.selectAll("path.country").data(countries.features).enter().append("path")
      .attr("class", "country").attr("d", path)
      .attr("fill", d => countryFillColor(d.properties.name))
      .attr("stroke", d => countryStrokeColor(d.properties.name))
      .attr("stroke-width", d => countryStrokeWidth(d.properties.name));

    const tooltip = document.getElementById("tooltip");

    CONFLICTS.forEach(c => {
      const [x, y] = projection([c.lon, c.lat]);

      const g = svg.append("g").attr("class", "hotspot-marker");

      g.append("circle").attr("cx", x).attr("cy", y).attr("r", Math.max(2, c.intensity * 0.5)).attr("fill", intensityColor(c.intensity)).attr("opacity", 0.9);

      g.on("mouseenter", (e) => {

        tooltip.style.opacity = 1;

let userLocation = null;
let riskIndex = 5;

function requestGPS() {
  const statusEl = document.getElementById("gpsStatus");

  if (!navigator.geolocation) {
    statusEl.textContent = t('gpsNoSupport');
    computeRisk(null);
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos => {
      userLocation = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      statusEl.innerHTML = tf('gpsLocated', userLocation.lat.toFixed(2), userLocation.lon.toFixed(2));

      if (window._projection && window._svg) {
        const [ux, uy] = window._projection([userLocation.lon, userLocation.lat]);
        if (ux && uy) {
          const g = window._svg.append("g").attr("class", "user-marker");
          g.append("circle").attr("cx", ux).attr("cy", uy).attr("r", 8).attr("fill", "rgba(34,197,94,.2)");
          g.append("circle").attr("cx", ux).attr("cy", uy).attr("r", 4).attr("fill", "#22c55e");
          g.append("circle").attr("cx", ux).attr("cy", uy).attr("r", 2).attr("fill", "#fff");
        }
      }
      computeRisk(userLocation);
    },
    err => {
      console.warn("GPS error:", err);
      statusEl.textContent = t('gpsError');
      computeRisk(null);
    },
    { enableHighAccuracy: false, timeout: 8000, maximumAge: 600000 }
  );
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function computeRisk(loc) {
  let factorsRaw = [];
  let score = 0;

  if (!loc) {
    score = 5.2;
    factorsRaw = [{type:'global',key:'factorGlobalHigh'},{type:'global',key:'factorSupplyChain'},{type:'global',key:'factorGeopolitical'}];
  } else {
    let proximityScore = 0;
    let nearConflicts = [];

    CONFLICTS.forEach(c => {
      const dist = haversine(loc.lat, loc.lon, c.lat, c.lon);
      let weight = 0;
      if (dist < 500) weight = c.intensity * 1.0;
      else if (dist < 1500) weight = c.intensity * 0.6;
      else if (dist < 3000) weight = c.intensity * 0.3;
      else if (dist < 6000) weight = c.intensity * 0.1;
      else weight = c.intensity * 0.03;
      proximityScore += weight;
      if (dist < 3000) nearConflicts.push({ ...c, dist: Math.round(dist) });
    });

    score = Math.min(10, Math.max(1, proximityScore / 8));
    score = Math.round(score * 10) / 10;

    nearConflicts.sort((a, b) => a.dist - b.dist);
    nearConflicts.slice(0, 3).forEach(c => {
      factorsRaw.push({type:'conflict',nameKey:c.nameKey,dist:c.dist});
    });
    factorsRaw.push({type:'global',key:'factorPressure'});
    if (score >= 6) factorsRaw.push({type:'global',key:'factorIncrease'});
  }

  riskIndex = score;
  window._riskFactorsRaw = factorsRaw;
  window._riskComputed = true;
  displayRisk(score, factorsRaw);
}

function displayRisk(score, factorsRaw) {
  const scoreEl = document.getElementById("riskScore");
  const descEl = document.getElementById("riskDesc");
  const factorsEl = document.getElementById("riskFactors");
  const btnEl = document.getElementById("enterCalcBtn");

  let color, descKey, btnBg;
  if (score >= 8) { color = "#991b1b"; descKey = 'riskExtreme'; btnBg = "linear-gradient(135deg,#991b1b,#7f1d1d)"; }
  else if (score >= 6) { color = "#ef4444"; descKey = 'riskHigh'; btnBg = "linear-gradient(135deg,#dc2626,#991b1b)"; }
  else if (score >= 4) { color = "#f97316"; descKey = 'riskMedium'; btnBg = "linear-gradient(135deg,#ea580c,#c2410c)"; }
  else { color = "#fbbf24"; descKey = 'riskLow'; btnBg = "linear-gradient(135deg,#d97706,#b45309)"; }

  scoreEl.textContent = score.toFixed(1);
  scoreEl.style.color = color;
  descEl.textContent = t(descKey);

  const factorTexts = factorsRaw.map(f => {
    if (f.type === 'conflict') return `${t(f.nameKey)} (${f.dist}km)`;
    return t(f.key);
  });
  factorsEl.innerHTML = factorTexts.map(f => `<span class="risk-factor">${f}</span>`).join("");
  btnEl.textContent = t('enterCalc');
  btnEl.style.background = btnBg;
  btnEl.style.display = "block";
}

  if(age>=10&&age<=17)return Math.round(weight*42);

  if(type==="none")return{daily:0,monthly:0,cost6mo:0,label:"",bagSize:0};

  important.push({n:t('itemNuts'),q:Math.ceil(n/2)+" "+t('bags'),c:Math.ceil(n/2)*15,r:t('rQualityFats')});
  important.push({n:t('itemFrzVeg'),q:frzVeg+" "+t('bags'),c:frzVeg*5,r:tf('rWeeklyVeg',n)});
  important.push({n:t('itemFrzBroc'),q:Math.round(n*1.5)+" "+t('bags'),c:Math.round(n*1.5)*4,r:t('rHighVitamin')});
  if(fuelExtra)important.push({n:t('itemFuel'),q:tf('canister',s.vehicles),c:s.vehicles*80,r:t('rInclFuel')});
  important.push({n:t('itemTP'),q:Math.max(Math.ceil(n*0.8*Math.min(s.months,3)/3),3)+" "+t('packs'),c:Math.max(Math.ceil(n*0.8*Math.min(s.months,3)/3),3)*12,r:tf('rTP',n)});
  important.push({n:t('itemClean'),q:t('r3moSupply'),c:Math.round(15+n*5),r:""});
  important.push({n:t('itemPersonal'),q:n+" "+t('people')+" × 3 "+t('months'),c:Math.round(n*12),r:t('rStockAll')});
  if(femaleCount>0)important.push({n:t('itemFeminine'),q:femaleCount+" "+t('people')+" × 3 "+t('months'),c:femaleCount*25,r:""});
  if(pet.daily>0)important.push({n:t('itemPetMed'),q:tf('monthsSupply',s.months),c:Math.round(s.months*15),r:t('rPetPrev')});
  important.push({n:t('itemStove'),q:t('set1'),c:Math.round(50+n*5),r:t('rBackupPower')});
  important.push({n:t('itemPowerBank'),q:Math.max(Math.ceil(n/3),1)+" "+t('units'),c:Math.max(Math.ceil(n/3),1)*50,r:t('rPhoneCharging')});
  important.push({n:t('itemBattery'),q:t('set1'),c:35,r:t('rBatteries')});

  general.push({n:t('itemVitamin'),q:Math.ceil(n*0.7)+" "+t('bottles'),c:Math.ceil(n*0.7)*15,r:t('rVegShortage')});
  if(hasElderly){
    const ec=md.filter(m=>m.special==="elderly"||m.age>=55).length;
    general.push({n:t('itemCalcium'),q:ec+" "+t('bottles'),c:ec*12,r:t('rSeniorBone')});
  }
  general.push({n:t('itemSnack'),q:t('moSupply'),c:Math.round(30+n*12),r:t('rMorale')});
  if(hou.gardenOk)general.push({n:t('itemGarden'),q:t('set1'),c:30,r:t('rGarden')});
  general.push({n:t('itemRadio'),q:t('unit1'),c:40,r:t('rEmInfo')});
  general.push({n:t('itemDocPouch'),q:Math.ceil(n/3)+" "+t('pieces'),c:Math.ceil(n/3)*10,r:t('rDocStorage')});
  if(pet.daily>0)general.push({n:t('itemPetEmKit'),q:t('set1'),c:80,r:t('rPetEmergency')});
  general.push({n:t('itemInsurance'),q:t('dashMark'),c:0,r:t('rChecklist')});

  const ut=urgent.reduce((a,i)=>a+i.c,0),it=important.reduce((a,i)=>a+i.c,0),gt2=general.reduce((a,i)=>a+i.c,0);
  return{md,totalCal,waterL,grainKg,pet,urgent,important,general,ut,it,gt:gt2,total:ut+it+gt2};
}

function renderCalc(){
  const el=document.getElementById("app");
  if(calcState.step===1){el.innerHTML=renderInput();}
  else{el.innerHTML=renderResult();}
  bindEvents();
}

function renderInput(){
  let membersHTML=calcState.members.map(m=>`
  <div class="member-grid" data-mid="${m.id}">
  <input type="text" value="${m.label}" data-field="label" placeholder="${t('colName')}">
  <input type="number" value="${m.age}" data-field="age" min="0" max="120">
  <input type="number" value="${m.weight}" data-field="weight" min="1" max="300">
  <select data-field="gender"><option value="m"${m.gender==="m"?" selected":""}>${t('genderM')}</option><option value="f"${m.gender==="f"?" selected":""}>${t('genderF')}</option></select>
  <select data-field="special"><option value=""${m.special===""?" selected":""}>${t('specialNone')}</option><option value="growing"${m.special==="growing"?" selected":""}>${t('specialGrowing')}</option><option value="pregnant"${m.special==="pregnant"?" selected":""}>${t('specialPregnant')}</option><option value="elderly"${m.special==="elderly"?" selected":""}>${t('specialElderly')}</option><option value="chronic"${m.special==="chronic"?" selected":""}>${t('specialChronic')}</option></select>
  ${calcState.members.length>1?`<button class="btn btn-sm btn-danger" data-remove="${m.id}">×</button>`:`<div></div>`}
  </div>`).join("");

  let regionsHTML=REGIONS.map(r=>`
  <label class="radio-card${calcState.region===r.id?" active":""}" data-region="${r.id}">
  <input type="radio" name="region" value="${r.id}"${calcState.region===r.id?" checked":""}>
  <div><div class="rc-title">${t(r.labelKey)}</div><div class="rc-desc">${t(r.descKey)}</div></div>
  </label>`).join("");

  let housingOpts=HOUSINGS.map(h=>`<option value="${h.id}"${calcState.housing===h.id?" selected":""}>${t(h.labelKey)}</option>`).join("");
  let petOpts=PETS.map(p=>`<option value="${p.id}"${calcState.petType===p.id?" selected":""}>${t(p.labelKey)}</option>`).join("");
  let vehOpts=[0,1,2,3].map(v=>`<option value="${v}"${calcState.vehicles===v?" selected":""}>${t('vehicles'+v)}</option>`).join("");
  let moOpts=[3,6,9,12].map(m=>`<option value="${m}"${calcState.months===m?" selected":""}>${m} ${t('months')}</option>`).join("");

  let sugMo = riskIndex >= 7 ? 6 : riskIndex >= 5 ? 3 : 1;

  return`
  <div class="risk-banner">
    <div class="rb-score" style="color:${riskIndex>=7?'#ef4444':riskIndex>=4?'#f97316':'#fbbf24'}">${riskIndex.toFixed(1)}</div>
    <div class="rb-text"><strong>${t('currentRisk')}</strong><br>${tf('recommendSupply',sugMo)} · ${userLocation ? t('basedGPS') : t('globalAvg')}</div>
    <button class="rb-back" onclick="backToMap()">${t('backToGlobal')}</button>
  </div>

  <h1>${t('calcTitle')}</h1>
  <div class="subtitle">${t('calcSubtitle')}</div>

  <div class="section s-red"><div class="section-header"><div class="section-num">1</div><h2>${t('secMembers')}</h2></div><div class="section-body">
  <div class="member-grid member-labels"><span>${t('colName')}</span><span style="text-align:center">${t('colAge')}</span><span style="text-align:center">${t('colWeight')}</span><span>${t('colGender')}</span><span>${t('colSpecial')}</span><span></span></div>
  ${membersHTML}
  <button class="btn btn-sm" id="addMember" style="margin-top:4px">${t('addMember')}</button>
  </div></div>

  <div class="section s-amber"><div class="section-header"><div class="section-num">2</div><h2>${t('secPets')}</h2></div><div class="section-body">
  <div class="field-row">
  <select id="petType">${petOpts}</select>
  ${calcState.petType!=="none"&&calcState.petType!=="cat"?`<label style="display:flex;align-items:center;gap:6px;font-size:13px">${t('weight')} <input type="number" id="petWeight" value="${calcState.petWeight}" min="1" max="80" style="width:56px"> kg</label>`:""}
  </div>
  </div></div>

  <div class="section s-blue"><div class="section-header"><div class="section-num">3</div><h2>${t('secRegion')}</h2></div><div class="section-body">
  <div style="font-size:12px;color:#888;margin-bottom:6px">${t('regionType')}</div>
  <div class="radio-grid" id="regionGrid">${regionsHTML}</div>
  <div class="inline-fields" style="margin-top:12px">
  <div class="inline-field"><label>${t('labelHousing')}</label><select id="housing">${housingOpts}</select></div>
  <div class="inline-field"><label>${t('labelVehicles')}</label><select id="vehicles">${vehOpts}</select></div>
  <div class="inline-field"><label>${t('labelPeriod')}</label><select id="months">${moOpts}</select></div>
  </div>
  </div></div>

  <button class="btn btn-primary" id="generateBtn">${t('generateBtn')}</button>
  <div class="footer">${t('calcFooter')}</div>`;
}

function renderResult(){
  const r=getResult();
  const memberTags=r.md.map(m=>`<span class="member-tag">${m.label} ${m.age}y/${m.weight}kg → ${m.cal.toLocaleString()}kcal/${{en:"day","zh-CN":"天","zh-TW":"天",ja:"日"}[currentLang]||"day"}</span>`).join("");
  const petTag=r.pet.daily>0?`<span class="member-tag pet">${{en:"Pet","zh-CN":"宠物","zh-TW":"寵物",ja:"ペット"}[currentLang]} → ${r.pet.daily}g/${{en:"day","zh-CN":"天","zh-TW":"天",ja:"日"}[currentLang]||"day"}</span>`:"";

  function tierHTML(items,title,tag){
    const total=items.reduce((a,i)=>a+i.c,0);
    const rows=items.map(i=>`<tr><td>${i.n}</td><td>${i.q}</td><td>$${i.c.toLocaleString()}</td><td>${i.r}</td></tr>`).join("");
    return`<div class="tier-section">
    <div class="tier-header"><span class="tier-tag ${tag}">${title}</span><span class="tier-total">$${total.toLocaleString()}</span></div>
    <table class="item-table"><thead><tr><th>${t('colItem')}</th><th>${t('colQty')}</th><th>${t('colCost')}</th><th>${t('colRationale')}</th></tr></thead><tbody>${rows}</tbody></table>
    </div>`;
  }

  return`
  <div class="risk-banner">
    <div class="rb-score" style="color:${riskIndex>=7?'#ef4444':riskIndex>=4?'#f97316':'#fbbf24'}">${riskIndex.toFixed(1)}</div>
    <div class="rb-text"><strong>${t('currentRisk')}</strong><br>${userLocation ? t('basedGPS') : t('globalAvg')}</div>
    <button class="rb-back" onclick="backToMap()">${t('backToGlobal')}</button>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
  <h2 style="font-size:17px">${calcState.members.length} ${t('people')}${calcState.petType!=="none"?t('pet'):""}·${calcState.months}${t('monthPlan')}</h2>
  <button class="btn btn-sm" id="backBtn">${t('editParams')}</button>
  </div>
  <div class="member-tags">${memberTags}${petTag}</div>
  <div class="summary-grid">
  <div class="summary-card"><div class="sc-label">${t('dailyCal')}</div><div class="sc-value">${r.totalCal.toLocaleString()}</div><div class="sc-sub">kcal · ${calcState.members.length} ${t('people')}</div></div>
  <div class="summary-card"><div class="sc-label">${t('grainReq')}</div><div class="sc-value">${r.grainKg}kg</div><div class="sc-sub">${t('grainSub')} · ${Math.min(calcState.months,3)} ${t('months')}</div></div>
  <div class="summary-card"><div class="sc-label">${t('emMonWater')}</div><div class="sc-value">${r.waterL}L</div><div class="sc-sub">${calcState.members.length} ${t('people')} × 3L × 7d</div></div>
  <div class="summary-card"><div class="sc-label">${t('totalBudget')}</div><div class="sc-value" style="color:#c53030">$${r.total.toLocaleString()}</div><div class="sc-sub">${t('inclCash')}</div></div>
  </div>
  ${tierHTML(r.urgent,t('tierUrgent'),"red")}
  ${tierHTML(r.important,t('tierImportant'),"amber")}
  ${tierHTML(r.general,t('tierGeneral'),"blue")}
  <div class="grand-total"><div class="gt-grid">
  <div><div class="gt-label">${t('labelUrgent')}</div><div class="gt-value">$${r.ut.toLocaleString()}</div></div>
  <div><div class="gt-label">${t('labelImportant')}</div><div class="gt-value">$${r.it.toLocaleString()}</div></div>
  <div><div class="gt-label">${t('labelGeneral')}</div><div class="gt-value">$${r.gt.toLocaleString()}</div></div>
  <div><div class="gt-label" style="color:#c53030;font-weight:600">${t('labelTotal')}</div><div class="gt-value gt-highlight">$${r.total.toLocaleString()}</div></div>
  </div></div>
  <div class="notes">${t('instructions')}</div>
  <button class="btn back-btn" id="backBtn2">${t('returnEdit')}</button>
  <div class="footer">${t('footerFull')}</div>`;
}

function bindEvents(){
  const s=calcState;
  document.querySelectorAll(".member-grid[data-mid]").forEach(row=>{
    const mid=+row.dataset.mid;
    row.querySelectorAll("input,select").forEach(el=>{
      const f=el.dataset.field;if(!f)return;
      el.addEventListener("change",()=>{
        const m=s.members.find(x=>x.id===mid);
        if(m){m[f]=el.type==="number"?+el.value:el.value;renderCalc();}
      });
    });
  });
  document.querySelectorAll("[data-remove]").forEach(b=>{
    b.addEventListener("click",()=>{s.members=s.members.filter(m=>m.id!==+b.dataset.remove);renderCalc();});
  });
  const addBtn=document.getElementById("addMember");
  if(addBtn)addBtn.addEventListener("click",()=>{
    s.members.push({id:s.nextId++,label:({en:"Member","zh-CN":"成员","zh-TW":"成員",ja:"メンバー"}[currentLang]||"Member")+(s.members.length+1),age:30,weight:60,gender:"m",special:""});renderCalc();
  });
  const petSel=document.getElementById("petType");
  if(petSel)petSel.addEventListener("change",()=>{s.petType=petSel.value;renderCalc();});
  const pwEl=document.getElementById("petWeight");
  if(pwEl)pwEl.addEventListener("change",()=>{s.petWeight=+pwEl.value;renderCalc();});
  document.querySelectorAll("[data-region]").forEach(card=>{
    card.addEventListener("click",()=>{s.region=card.dataset.region;renderCalc();});
  });
  ["housing","vehicles","months"].forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.addEventListener("change",()=>{s[id]=id==="housing"?el.value:+el.value;renderCalc();});
  });
  const genBtn=document.getElementById("generateBtn");
  if(genBtn)genBtn.addEventListener("click",()=>{s.step=2;renderCalc();window.scrollTo(0,0);});
  [document.getElementById("backBtn"),document.getElementById("backBtn2")].forEach(b=>{
    if(b)b.addEventListener("click",()=>{s.step=1;renderCalc();window.scrollTo(0,0);});
  });
}

// ====== INIT ======
document.addEventListener("DOMContentLoaded", initMap);
</script>
