function intensityColor(i){if(i>=9)return"#991b1b";if(i>=7)return"#ef4444";if(i>=5)return"#f97316";if(i>=3)return"#fbbf24";return"#4ade80";}

function countryFillColor(name){
  const r=COUNTRY_RISK[name];if(!r)return"rgba(34,197,94,0.04)";
  const a=Math.min(r/10,1);
  if(r>=8)return`rgba(153,27,27,${a*0.7})`;if(r>=6)return`rgba(239,68,68,${a*0.5})`;
  if(r>=4)return`rgba(249,115,22,${a*0.35})`;return`rgba(251,191,36,${a*0.2})`;
}

// ====== DYNAMIC CONFLICT DATA ======
let lastUpdatedDate = null;
async function loadConflictData(){
  try{
    const res = await fetch("/api/conflicts");
    if(!res.ok) return;
    const data = await res.json();
    if(data.conflicts && data.conflicts.length > 0){
      CONFLICTS = data.conflicts;
      // Merge dynamic Chinese descriptions from API into translation map
      data.conflicts.forEach(c=>{ if(c.descZh) CONFLICT_ZH.descs[c.desc]=c.descZh; });
    }
    if(data.lastUpdated) lastUpdatedDate = new Date(data.lastUpdated);
    if(data.topNews && data.topNews.length > 0) renderNewsPanel(data.topNews);
  }catch(_){}
}
let _newsData = null;
// ====== EMAIL SUBSCRIBE ======
async function handleSubscribe(e){
  e.preventDefault();
  const form=e.target;
  const emailInput=form.querySelector('input[type="email"]');
  const btn=form.querySelector('button[type="submit"]');
  const msg=form.parentElement.querySelector('.sub-msg');
  const email=emailInput.value.trim();
  if(!email)return;
  btn.disabled=true;btn.textContent="...";
  try{
    const r=await fetch("/api/subscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,country:window._userCountry||"Unknown"})});
    const d=await r.json();
    if(d.ok){
      msg.className="sub-msg success";
      msg.textContent=d.message==="already_subscribed"?t("subAlready"):t("subSuccess");
      emailInput.value="";
    }else{
      msg.className="sub-msg error";msg.textContent=d.error||t("subError");
    }
  }catch(_){msg.className="sub-msg error";msg.textContent=t("subError");}
  btn.disabled=false;btn.textContent=t("subBtn");
}

function renderNewsPanel(news){
  _newsData = news;
  const panel=document.getElementById("newsPanel");
  const container=document.getElementById("npItems");
  if(!panel||!container) return;
  document.getElementById("npTitle").textContent=t("npTitle");
  container.innerHTML=news.map(n=>{
    const title = lang==='zh' ? (n.headlineZh || tConflict('descs', n.headline)) : n.headline;
    const conflictName = tConflict('names', n.conflict);
    const headline=n.url
      ? `<a href="${n.url}" target="_blank" rel="noopener">${title}</a>`
      : title;
    return `<div class="np-item"><div class="np-conflict">${conflictName}</div><div class="np-headline">${headline}</div><div class="np-meta">${n.articles} ${t("npArticles")}</div></div>`;
  }).join("");
  panel.classList.add("loaded");
}
function formatUpdateDate(l){
  if(!lastUpdatedDate) return null;
  if(l==='zh'){
    return `â ${lastUpdatedDate.getFullYear()}å¹´${lastUpdatedDate.getMonth()+1}æ${lastUpdatedDate.getDate()}æ¥æå¿æ°æ®`;
  }
  const m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `â ${m[lastUpdatedDate.getMonth()]} ${lastUpdatedDate.getDate()}, ${lastUpdatedDate.getFullYear()} Situation Data`;
}

// ====== MAP RENDERING ======
async function initMap(){
  await loadConflictData();
  document.title=t('pageTitle');
  document.documentElement.lang=lang==='zh'?'zh-CN':'en';
  updateLangSwitcher();
  updateMapPageText();

  const tooltip=document.getElementById("conflictTooltip");
  const width=960,height=500;
  const svg=d3.select("#worldMap").append("svg").attr("viewBox",`0 0 ${width} ${height}`).style("background","transparent");
  const projection=d3.geoNaturalEarth1().scale(153).translate([width/2,height/2]);
  const path=d3.geoPath().projection(projection);

  fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
    .then(r=>r.json())
    .then(world=>{
      const countries=topojson.feature(world,world.objects.countries);
      window._countries=countries;
      svg.append("g").selectAll("path").data(countries.features).enter().append("path")
        .attr("d",path)
        .attr("fill",d=>{const n=d.properties&&d.properties.name?d.properties.name:"";return countryFillColor(n);})
        .attr("stroke",d=>{
          const n=d.properties&&d.properties.name?d.properties.name:"";
          const r=COUNTRY_RISK[n];
          if(!r)return"rgba(34,197,94,0.35)";if(r>=7)return"rgba(239,68,68,0.25)";if(r>=4)return"rgba(249,115,22,0.18)";return"rgba(251,191,36,0.12)";
        })
        .attr("stroke-width",d=>{const n=d.properties&&d.properties.name?d.properties.name:"";return COUNTRY_RISK[n]?0.5:0.8;});

      CONFLICTS.forEach(c=>{
        const [x,y]=projection([c.lon,c.lat]);if(!x||!y)return;
        const g=svg.append("g").attr("class","hotspot-marker");
        g.append("circle").attr("class","hotspot-ring").attr("cx",x).attr("cy",y).attr("r",6).attr("fill","none").attr("stroke",intensityColor(c.intensity)).attr("stroke-width",1.5).attr("opacity",0.5);
        g.append("circle").attr("cx",x).attr("cy",y).attr("r",Math.max(2,c.intensity*0.5)).attr("fill",intensityColor(c.intensity)).attr("opacity",0.9);
        g.on("mouseenter",e=>{
          tooltip.innerHTML=`<div class="ct-name">${tConflict('names',c.name)}</div><div class="ct-level" style="color:${intensityColor(c.intensity)}">â ${tConflict('types',c.type)} Â· ${t('tooltipLevel')} ${c.intensity}/10</div><div class="ct-desc">${tConflict('descs',c.desc)}</div>`;
          tooltip.style.opacity=1;tooltip.style.left=(e.clientX+12)+"px";tooltip.style.top=(e.clientY-10)+"px";
        }).on("mouseleave",()=>{tooltip.style.opacity=0;}).on("click",()=>{openSourcePanel(c);});
      });

      window._projection=projection;window._svg=svg;
      requestGPS();
    }).catch(()=>{
      document.getElementById("worldMap").innerHTML=`<div style="text-align:center;color:#555;padding:40px">${lang==='zh'?'å è½½å°å¾ä¸­...':'Loading map...'}</div>`;
      requestGPS();
    });
}

// ====== GPS & RISK ======
let userLocation=null,riskIndex=null,riskFactorsCache=[];

function requestGPS(){
  const el=document.getElementById("gpsStatus");
  el.textContent=t('gpsLocating');
  if(!navigator.geolocation){el.textContent=t('gpsNoSupport');calculateRisk(null);return;}
  navigator.geolocation.getCurrentPosition(
    pos=>{
      userLocation={lat:pos.coords.latitude,lon:pos.coords.longitude};
      let userCountryName="";
      if(window._countries){
        const uf=window._countries.features.find(f=>d3.geoContains(f,[userLocation.lon,userLocation.lat]));
        userCountryName=uf&&uf.properties?uf.properties.name:"";
        window._userCountry=userCountryName;
      }
      const latDir=userLocation.lat>=0?"N":"S";
      const lonDir=userLocation.lon>=0?"E":"W";
      el.innerHTML=`<span class="pin">ð</span> ${userCountryName?userCountryName+" Â· ":""}${Math.abs(userLocation.lat).toFixed(2)}Â°${latDir}, ${Math.abs(userLocation.lon).toFixed(2)}Â°${lonDir}`;
      if(window._projection&&window._svg){
        const[ux,uy]=window._projection([userLocation.lon,userLocation.lat]);
        if(ux&&uy){
          const g=window._svg.append("g").attr("class","user-marker");
          g.append("circle").attr("cx",ux).attr("cy",uy).attr("r",8).attr("fill","rgba(34,197,94,.2)");
          g.append("circle").attr("cx",ux).attr("cy",uy).attr("r",4).attr("fill","#22c55e");
          g.append("circle").attr("cx",ux).attr("cy",uy).attr("r",2).attr("fill","#fff");
          g.style("cursor","pointer");
          g.on("mouseenter",e=>{
            const tooltip=document.getElementById("conflictTooltip");
            tooltip.innerHTML=`<div class="ct-name">${userCountryName||t('gpsYourLocation')}</div><div class="ct-desc" style="color:#22c55e">ð ${t('gpsYourLocation')}</div>`;
            tooltip.style.opacity=1;tooltip.style.left=(e.clientX+12)+"px";tooltip.style.top=(e.clientY-10)+"px";
          }).on("mouseleave",()=>{document.getElementById("conflictTooltip").style.opacity=0;});
        }
      }
      calculateRisk(userLocation);
      initVisitorCounter();
    },
    err=>{console.warn("GPS:",err);document.getElementById("gpsStatus").textContent=t('gpsError');calculateRisk(null);initVisitorCounter();},
    {enableHighAccuracy:false,timeout:8000,maximumAge:600000}
  );
}

function haversine(lat1,lon1,lat2,lon2){
  const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function calculateRisk(loc){
  let factors=[],score=0;
  if(!loc){
    score=5.2;factors=[...t('globalFactors')];
  } else {
    let ps=0,near=[];
    CONFLICTS.forEach(c=>{
      const d=haversine(loc.lat,loc.lon,c.lat,c.lon);
      let w=0;if(d<500)w=c.intensity*1.0;else if(d<1500)w=c.intensity*0.6;else if(d<3000)w=c.intensity*0.3;else if(d<6000)w=c.intensity*0.1;else w=c.intensity*0.03;
      ps+=w;if(d<3000)near.push({...c,dist:Math.round(d)});
    });
    score=Math.min(10,Math.max(1,ps/8));score=Math.round(score*10)/10;
    near.sort((a,b)=>a.dist-b.dist);near.slice(0,3).forEach(c=>factors.push(`${tConflict('names',c.name)} (${c.dist}km)`));
    factors.push(t('globalPressure'));if(score>=6)factors.push(t('riskSuggestMore'));
  }
  riskFactorsCache=factors;
  displayRisk(score,factors,loc);
}

function displayRisk(score,factors,loc){
  riskIndex=score;
  const scoreEl=document.getElementById("riskScore"),descEl=document.getElementById("riskDesc");
  const factorsEl=document.getElementById("riskFactors"),btnEl=document.getElementById("enterCalcBtn");
  let color,desc,btnBg;
  if(score>=8){color="#991b1b";desc=t('riskExtreme');btnBg="linear-gradient(135deg,#991b1b,#7f1d1d)";}
  else if(score>=6){color="#ef4444";desc=t('riskHigh');btnBg="linear-gradient(135deg,#dc2626,#991b1b)";}
  else if(score>=4){color="#f97316";desc=t('riskMedium');btnBg="linear-gradient(135deg,#ea580c,#c2410c)";}
  else{color="#fbbf24";desc=t('riskSafe');btnBg="linear-gradient(135deg,#d97706,#b45309)";}
  scoreEl.textContent=score.toFixed(1);scoreEl.style.color=color;descEl.textContent=desc;
  factorsEl.innerHTML=factors.map(f=>`<span class="risk-factor">${f}</span>`).join("");
  btnEl.textContent=t('enterCalcBtn');btnEl.style.background=btnBg;btnEl.style.display="block";
}

let calcState={step:1,members:[{id:1,label:"",age:40,weight:70,gender:"m",special:""}],nextId:2,region:"island_import",housing:"house",petType:"none",petWeight:30,vehicles:1,months:6,country:""};

function calcCal(age,weight,gender,special){
  if(age>=10&&age<=17)return Math.round(weight*42);
  if(special==="pregnant")return Math.round(weight*(gender==="f"?25:30)*1.3+300);
  if(gender==="m")return Math.round(weight*30*1.3);
  return Math.round(weight*25*1.3);
}

function calcPet(type,weight){
  if(type==="none")return{daily:0,monthly:0,cost6mo:0,label:""};
  if(type==="cat")return{daily:60,monthly:1.8,cost6mo:120,label:t('iCatFood'),bagSize:4};
  const d=Math.round(weight*0.025*1000*0.35+weight*3),m=Math.round(d*30/1000*10)/10;
  const cpk=type==="dog_large"?4.5:type==="dog_medium"?5:6,bs=type==="dog_large"?15:10;
  return{daily:d,monthly:m,cost6mo:Math.round(m*6*cpk),label:t('iDogFood'),bagSize:bs};
}

function renderResult(){
  const r=generate();

  const memberTags=r.md.map(m=>`<span class="member-tag">${m.label||t('memberDefault')+m.id} ${m.age}${au}/${m.weight}kg â ${m.cal.toLocaleString()}kcal${pd}</span>`).join("");
  const petTag=r.pet.daily>0?`<span class="member-tag pet">${lang==='zh'?'å® ç©':'Pet'} â ${r.pet.daily}g${pd}</span>`:"";
  const petSfx=calcState.petType!=="none"?t('petSuffix'):"";
  const planTitle=lang==='zh'?`${calcState.members.length}${t('planPeopleSuffix')}${petSfx}Â·${calcState.months}${t('planMonthSuffix')}`:`${calcState.members.length} ${t('planPeopleSuffix')}${petSfx} Â· ${calcState.months}${t('planMonthSuffix')}`;
  const rc=riskIndex!==null?(riskIndex>=7?'#ef4444':riskIndex>=4?'#f97316':'#fbbf24'):'#fbbf24';

  function tierHTML(items,title,tag){
    const total=items.reduce((a,i)=>a+i.c,0);
    const rows=items.map(i=>`<tr><td>${i.n}</td><td>${i.q}</td><td>${r.currSymbol}${i.c.toLocaleString()}</td><td>${i.r}</td></tr>`).join("");
    return`<div class="tier-section"><div class="tier-header"><span class="tier-tag ${tag}">${title}</span><span class="tier-total">${r.currSymbol}${total.toLocaleString()}</span></div><table class="item-table"><thead><tr><th>${t('thItem')}</th><th>${t('thQty')}</th><th>${t('thCost')}</th><th>${t('thRationale')}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  return`
  <div class="risk-banner">
    <div class="rb-score" style="color:${rc}">${riskIndex!==null?riskIndex.toFixed(1):'â'}</div>
    <div class="rb-text"><strong>${t('riskIndex')}</strong><br>${userLocation?t('basedOnGPS'):t('globalAvg')}</div>
    <button class="rb-back" onclick="backToMap()">${t('backToMap')}</button>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
  <h2 style="font-size:17px">${planTitle}</h2>
  <button class="btn btn-sm" id="backBtn">${t('editParams')}</button>
  </div>
  <div class="member-tags">${memberTags}${petTag}</div>
  <div class="summary-grid">
  <div class="summary-card"><div class="sc-label">${t('labelDailyCal')}</div><div class="sc-value">${r.totalCal.toLocaleString()}</div><div class="sc-sub">kcal Â· ${calcState.members.length} ${pu}</div></div>
  <div class="summary-card"><div class="sc-label">${t('labelGrain')}</div><div class="sc-value">${r.grainKg}kg</div><div class="sc-sub">${t('grainSubPrefix')} ${Math.min(calcState.months,3)} ${t('grainSubSuffix')}</div></div>
  <div class="summary-card"><div class="sc-label">${t('labelWater')}</div><div class="sc-value">${r.waterL}L</div><div class="sc-sub">${calcState.members.length} ${pu} ${t('waterSubSuffix')}</div></div>
  <div class="summary-card"><div class="sc-label">${t('labelBudget')}</div><div class="sc-value" style="color:#c53030">${r.currSymbol}${r.total.toLocaleString()}</div><div class="sc-sub">${t('budgetSub')}</div></div>
  </div>
  ${tierHTML(r.urgent,t('tierUrgent'),"red")}
  ${tierHTML(r.important,t('tierImportant'),"amber")}
  ${tierHTML(r.general,t('tierGeneral'),"blue")}
  <div class="grand-total"><div class="gt-grid">
  <div><div class="gt-label">${t('totalUrgent')}</div><div class="gt-value">${r.currSymbol}${r.ut.toLocaleString()}</div></div>
  <div><div class="gt-label">${t('totalImportant')}</div><div class="gt-value">${r.currSymbol}${r.it.toLocaleString()}</div></div>
  <div><div class="gt-label">${t('totalGeneral')}</div><div class="gt-value">${r.currSymbol}${r.gt.toLocaleString()}</div></div>
  <div><div class="gt-label" style="color:#c53030;font-weight:600">${t('totalLabel')}</div><div class="gt-value gt-highlight">${r.currSymbol}${r.total.toLocaleString()}</div></div>
  </div></div>
  <div class="notes">${t('notesText')}</div>
  <button class="btn back-btn" id="backBtn2">${t('backBtn')}</button>
  <div class="footer">${t('calcFooterResult')}</div>
  <div class="subscribe-box" id="subscribeBox">
    <div class="sub-title">${t('subTitle')}</div>
    <div class="sub-desc">${t('subDesc')}</div>
    <form class="sub-form" onsubmit="handleSubscribe(event)">
      <input type="email" id="subEmail" placeholder="${t('subPlaceholder')}" required>
      <button type="submit" id="subBtn">${t('subBtn')}</button>
    </form>
    <div class="sub-msg" id="subMsg"></div>
  </div>`;
}

function bindEvents(){
  const s=calcState;
  document.querySelectorAll(".member-grid[data-mid]").forEach(row=>{
    const mid=+row.dataset.mid;
    row.querySelectorAll("input,select").forEach(el=>{
      const f=el.dataset.field;if(!f)return;
      el.addEventListener("change",()=>{const m=s.members.find(x=>x.id===mid);if(m){m[f]=el.type==="number"?+el.value:el.value;renderCalc();}});
    });
  });
  document.querySelectorAll("[data-remove]").forEach(b=>{b.addEventListener("click",()=>{s.members=s.members.filter(m=>m.id!==+b.dataset.remove);renderCalc();});});
  const addBtn=document.getElementById("addMember");
  if(addBtn)addBtn.addEventListener("click",()=>{s.members.push({id:s.nextId++,label:"",age:30,weight:60,gender:"m",special:""});renderCalc();});
  const petSel=document.getElementById("petType");
  if(petSel)petSel.addEventListener("change",()=>{s.petType=petSel.value;renderCalc();});
  const pwEl=document.getElementById("petWeight");
  if(pwEl)pwEl.addEventListener("change",()=>{s.petWeight=+pwEl.value;renderCalc();});
  const countrySel=document.getElementById("countrySelect");
  if(countrySel)countrySel.addEventListener("change",()=>{
    s.country=countrySel.value;
    if(s.country&&COUNTRY_PROFILES[s.country]){
      s.region=COUNTRY_PROFILES[s.country].region;
    }
    renderCalc();
  });
  document.querySelectorAll("[data-region]").forEach(card=>{card.addEventListener("click",()=>{s.region=card.dataset.region;renderCalc();});});
  ["housing","vehicles","months"].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener("change",()=>{s[id]=id==="housing"?el.value:+el.value;renderCalc();});});
  const genBtn=document.getElementById("generateBtn");
  if(genBtn)genBtn.addEventListener("click",()=>{s.step=2;renderCalc();window.scrollTo(0,0);});
  [document.getElementById("backBtn"),document.getElementById("backBtn2")].forEach(b=>{if(b)b.addEventListener("click",()=>{s.step=1;renderCalc();window.scrollTo(0,0);});});
}

function openSourcePanel(c){
  const panel=document.getElementById("sourcePanel");
  const linksHTML=(c.sources||[]).map(s=>`<a class="sp-link" href="${s.url}" target="_blank" rel="noopener">${s.title}<span class="sp-link-arrow">â</span></a>`).join("");
  document.getElementById("sourcePanelContent").innerHTML=`
    <div class="sp-name">${tConflict('names',c.name)}</div>
    <div class="sp-type" style="color:${intensityColor(c.intensity)}">â ${tConflict('types',c.type)} Â· ${t('tooltipLevel')} ${c.intensity}/10</div>
    <div class="sp-desc">${tConflict('descs',c.desc)}</div>
    <div class="sp-sources-title">${t('sourcesTitle')}</div>
    ${linksHTML}`;
  panel.classList.add("open");
}
function closeSourcePanel(){document.getElementById("sourcePanel").classList.remove("open");}
document.getElementById("mapPage").addEventListener("click",e=>{
  if(!e.target.closest(".source-panel")&&!e.target.closest(".hotspot-marker"))closeSourcePanel();
});
