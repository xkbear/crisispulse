<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Crisis Monitor & Family Emergency Supply Calculator | Crisis Pulse</title>
<meta name="description" content="Analyze global conflict situations and generate personalized family emergency supply lists based on your location and family parameters.">
<link rel="icon" type="image/svg+xml" href="logo.svg">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;color:#1a1a1a;background:#0a0a0f;line-height:1.6;-webkit-font-smoothing:antialiased}

/* ====== LANGUAGE SWITCHER ====== */
.lang-switcher{position:fixed;top:12px;right:16px;z-index:200;display:flex;gap:2px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:3px;backdrop-filter:blur(8px)}
.lang-btn{padding:5px 10px;border:none;border-radius:8px;font-size:12px;cursor:pointer;background:transparent;color:#888;transition:all .2s;font-weight:500;white-space:nowrap}
.lang-btn.active{background:rgba(255,255,255,.15);color:#fff;font-weight:600}
.lang-btn:hover:not(.active){color:#ccc}
.calc-page .lang-switcher{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.1)}
.calc-page .lang-btn{color:#999}
.calc-page .lang-btn.active{background:rgba(0,0,0,.08);color:#333}
.calc-page .lang-btn:hover:not(.active){color:#666}

/* ====== PAGE: MAP ====== */
.map-page{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#0a0a0f 0%,#0d1117 50%,#0a0a0f 100%)}
.map-header{text-align:center;padding:24px 16px 8px}
.map-header h1{font-size:22px;font-weight:700;color:#e6e6e6;letter-spacing:1px}
.map-header .subtitle{font-size:12px;color:#666;margin-top:4px}
.map-header .live-tag{display:inline-block;font-size:10px;color:#ef4444;background:rgba(239,68,68,.12);padding:2px 10px;border-radius:10px;margin-top:8px;animation:pulse-tag 2s infinite}
@keyframes pulse-tag{0%,100%{opacity:1}50%{opacity:.5}}
.map-container{flex:1;display:flex;align-items:center;justify-content:center;padding:0 8px;position:relative;min-height:380px}
#worldMap{width:100%;max-width:960px}
#worldMap svg{width:100%;height:auto}
.map-legend{display:flex;justify-content:center;gap:16px;padding:8px 16px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#888}
.legend-dot{width:10px;height:10px;border-radius:50%}
.risk-panel{max-width:600px;margin:0 auto;padding:16px}
.risk-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:20px;text-align:center}
.risk-label{font-size:12px;color:#888;margin-bottom:4px}
.risk-score{font-size:48px;font-weight:800;margin:4px 0}
.risk-desc{font-size:13px;color:#aaa;margin-bottom:16px;line-height:1.6}
.risk-factors{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:16px}
.risk-factor{font-size:11px;padding:3px 10px;border-radius:8px;background:rgba(255,255,255,.06);color:#ccc}
.gps-status{font-size:11px;color:#555;margin-bottom:12px}
.gps-status .pin{color:#22c55e}
.btn-enter{display:block;width:100%;max-width:360px;margin:0 auto;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;color:#fff}
.btn-enter:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.conflict-tooltip{position:fixed;pointer-events:none;background:rgba(15,15,20,.92);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 14px;font-size:12px;color:#ddd;max-width:240px;z-index:100;opacity:0;transition:opacity .15s}
.conflict-tooltip .ct-name{font-weight:700;font-size:13px;margin-bottom:3px}
.conflict-tooltip .ct-level{font-size:11px;margin-bottom:2px}
.conflict-tooltip .ct-desc{font-size:11px;color:#999}
.hotspot-marker{cursor:pointer}
.hotspot-ring{animation:ring-pulse 2.5s infinite}
@keyframes ring-pulse{0%{opacity:.7;r:6}50%{opacity:.2;r:14}100%{opacity:.7;r:6}}
.user-marker{filter:drop-shadow(0 0 6px rgba(34,197,94,.6))}
.humanistic-message{margin-bottom:12px;padding:12px 14px;background:rgba(255,255,255,.05);border-left:3px solid rgba(255,255,255,.2);border-radius:6px;font-size:13px;color:#aaa;line-height:1.6;font-style:italic}

/* ====== PAGE: CALCULATOR ====== */
.calc-page{display:none;background:#f8f8f6;min-height:100vh}
.app{max-width:680px;margin:0 auto;padding:16px}
h1{font-size:20px;font-weight:700;margin-bottom:4px}
h2{font-size:16px;font-weight:600;margin:0 0 8px}
.subtitle{font-size:12px;color:#888;margin-bottom:20px}
.section{background:#fff;border-radius:12px;border:1px solid #e8e8e4;margin-bottom:16px;overflow:hidden}
.section-header{padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0f0ec}
.section-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.s-red .section-num{background:#fde8e8;color:#c53030}
.s-amber .section-num{background:#fef3c7;color:#b45309}
.s-blue .section-num{background:#dbeafe;color:#1d4ed8}
.s-green .section-num{background:#dcfce7;color:#15803d}
.section-body{padding:14px 16px}
.field-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.field-row label{font-size:12px;color:#666;min-width:50px}
input[type=text],input[type=number],select{padding:7px 10px;border:1px solid #ddd;border-radius:8px;font-size:13px;background:#fff;color:#1a1a1a;outline:none;transition:border .2s}
input:focus,select:focus{border-color:#3b82f6}
input[type=number]{width:64px;text-align:center}
select{cursor:pointer}
.member-grid{display:grid;grid-template-columns:1fr 60px 64px 70px 90px 30px;gap:5px;align-items:center;margin-bottom:6px;font-size:13px}
.member-labels{font-size:11px;color:#999;padding-bottom:4px}
.btn{padding:8px 16px;border:1px solid #ddd;border-radius:8px;background:#fff;font-size:13px;cursor:pointer;transition:all .15s}
.btn:hover{background:#f5f5f3;border-color:#ccc}
.btn:active{transform:scale(.98)}
.btn-primary{background:#1d4ed8;color:#fff;border:none;font-weight:600;width:100%;padding:12px;font-size:15px;border-radius:10px}
.btn-primary:hover{background:#1e40af}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-danger{color:#dc2626;border-color:#fca5a5}
.btn-danger:hover{background:#fef2f2}
.radio-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:500px){.radio-grid{grid-template-columns:1fr}.member-grid{grid-template-columns:1fr 50px 54px 60px 80px 26px;gap:3px}}
.radio-card{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:10px;border:1.5px solid #e8e8e4;background:#fff;cursor:pointer;transition:border .2s}
.radio-card.active{border-color:#3b82f6;background:#eff6ff}
.radio-card input{margin-top:3px}
.radio-card .rc-title{font-size:13px;font-weight:600}
.radio-card .rc-desc{font-size:11px;color:#888}
.inline-fields{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.inline-field{display:flex;align-items:center;gap:6px;font-size:13px}
.inline-field label{color:#666;white-space:nowrap}
.risk-banner{background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;color:#fff}
.risk-banner .rb-score{font-size:28px;font-weight:800;min-width:50px;text-align:center}
.risk-banner .rb-text{font-size:12px;color:#aaa;line-height:1.5}
.risk-banner .rb-text strong{color:#e6e6e6;font-size:13px}
.risk-banner .rb-back{margin-left:auto;font-size:11px;color:#666;cursor:pointer;white-space:nowrap;padding:6px 12px;border:1px solid #333;border-radius:8px;background:transparent;transition:all .2s}
.risk-banner .rb-back:hover{border-color:#555;color:#aaa}
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
@media(max-width:500px){.summary-grid{grid-template-columns:repeat(2,1fr)}}
.summary-card{background:#f8f8f6;border-radius:10px;padding:10px 12px}
.summary-card .sc-label{font-size:11px;color:#888}
.summary-card .sc-value{font-size:20px;font-weight:700;margin:2px 0}
.summary-card .sc-sub{font-size:11px;color:#aaa}
.member-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.member-tag{font-size:12px;padding:3px 10px;border-radius:8px;background:#f0f0ec}
.member-tag.pet{background:#fef3c7}
.tier-section{margin-bottom:16px}
.tier-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tier-tag{font-size:11px;font-weight:600;padding:3px 10px;border-radius:6px}
.tier-tag.red{background:#fde8e8;color:#c53030}
.tier-tag.amber{background:#fef3c7;color:#b45309}
.tier-tag.blue{background:#dbeafe;color:#1d4ed8}
.tier-total{font-size:14px;font-weight:700}
.item-table{width:100%;border-collapse:collapse;font-size:12px;border:1px solid #e8e8e4;border-radius:10px;overflow:hidden}
.item-table thead{background:#f8f8f6}
.item-table th{padding:7px 10px;text-align:left;font-weight:500;font-size:11px;color:#888}
.item-table th:nth-child(2){text-align:center;width:80px}
.item-table th:nth-child(3){text-align:right;width:60px}
.item-table td{padding:6px 10px;border-top:1px solid #f0f0ec}
.item-table td:nth-child(2){text-align:center;color:#888}
.item-table td:nth-child(3){text-align:right;font-weight:600}
.item-table td:nth-child(4){color:#aaa;font-size:11px}
.grand-total{background:#fff;border-radius:12px;border:1px solid #e8e8e4;padding:14px 16px;margin-top:12px}
.gt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:13px}
.gt-label{color:#888;font-size:11px}
.gt-value{font-weight:700}
.gt-highlight{font-size:18px;color:#c53030}
.notes{margin-top:12px;padding:12px 14px;border-radius:10px;background:#fff;border:1px solid #e8e8e4;font-size:12px;color:#888;line-height:1.8}
.back-btn{width:100%;padding:10px;font-size:14px;margin-top:12px}
.footer{text-align:center;padding:20px 0 10px;font-size:11px;color:#bbb}
.footer a{color:#999;text-decoration:none}
.fade-out{animation:fadeOut .4s forwards}
.fade-in{animation:fadeIn .4s forwards}
@keyframes fadeOut{to{opacity:0;transform:translateY(-10px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.data-source{text-align:center;padding:8px 16px 20px;font-size:10px;color:#444}
.visitor-panel{position:fixed;left:12px;top:50%;transform:translateY(-50%);z-index:150;background:rgba(10,10,15,0.85);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:14px 16px;min-width:160px;max-height:55vh;overflow-y:auto;color:#e6e6e6;font-size:12px;opacity:0;transition:opacity 0.6s ease}
.visitor-panel.loaded{opacity:1}
.visitor-panel .vp-title{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px}
.visitor-panel .vp-total{font-size:22px;font-weight:800;color:#60a5fa;margin-bottom:10px}
.visitor-panel .vp-country{display:flex;align-items:center;gap:7px;padding:3px 0;border-top:1px solid rgba(255,255,255,0.04)}
.visitor-panel .vp-flag{font-size:14px}
.visitor-panel .vp-name{flex:1;color:#aaa;font-size:11px}
.visitor-panel .vp-count{color:#666;font-size:11px;font-variant-numeric:tabular-nums}
@media(max-width:768px){.visitor-panel{display:none}}
.source-panel{position:fixed;top:0;right:-380px;width:360px;height:100vh;background:rgba(10,10,15,0.92);backdrop-filter:blur(16px);border-left:1px solid rgba(255,255,255,0.08);z-index:300;transition:right 0.3s ease;padding:24px 20px;overflow-y:auto;color:#e6e6e6}
.source-panel.open{right:0}
.source-panel .sp-close{position:absolute;top:12px;right:16px;background:none;border:none;color:#888;font-size:20px;cursor:pointer;padding:4px 8px}
.source-panel .sp-close:hover{color:#fff}
.source-panel .sp-name{font-size:18px;font-weight:700;margin-bottom:6px;padding-right:30px}
.source-panel .sp-type{font-size:13px;margin-bottom:12px}
.source-panel .sp-desc{font-size:13px;color:#aaa;margin-bottom:20px;line-height:1.6;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,0.08)}
.source-panel .sp-sources-title{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.source-panel .sp-link{display:block;padding:10px 12px;margin-bottom:8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:8px;color:#60a5fa;text-decoration:none;font-size:13px;transition:all 0.2s}
.source-panel .sp-link:hover{background:rgba(255,255,255,0.08);border-color:rgba(96,165,250,0.3)}
.source-panel .sp-link-arrow{float:right;color:#555}
</style>
</head>

<!-- ====== MAP PAGE ====== -->

<!-- ====== CALCULATOR PAGE ====== -->
<div class="calc-page" id="calcPage">

// ====== LANGUAGE STATE ======
let lang = localStorage.getItem('cp_lang') || (navigator.language && navigator.language.startsWith('zh') ? 'zh' : 'en');

function t(k) { return T[lang][k] !== undefined ? T[lang][k] : (T.en[k] !== undefined ? T.en[k] : k); }

function setLang(l) {
  lang = l;
  localStorage.setItem('cp_lang', l);
  document.documentElement.lang = l === 'zh' ? 'zh-CN' : 'en';
  document.title = t('pageTitle');
  updateLangSwitcher();
  updateMapPageText();
  const calcPage = document.getElementById('calcPage');
  if (calcPage && calcPage.style.display !== 'none') renderCalc();
}

function updateLangSwitcher() {
  document.getElementById('btnEN').classList.toggle('active', lang === 'en');
  document.getElementById('btnZH').classList.toggle('active', lang === 'zh');
}

function updateMapPageText() {
  document.getElementById('mapTitle').textContent = t('mapTitle');
  document.getElementById('mapSubtitle').textContent = t('mapSubtitle');
  document.getElementById('liveTag').textContent = t('liveTag');
  document.getElementById('humanisticMsg').textContent = t('humanisticMsg');
  document.getElementById('riskLabel').textContent = t('riskLabel');
  renderLegend();
  document.getElementById('dataSource').innerHTML = t('dataSource').replace('\n','<br>');
  if (riskIndex !== null) displayRisk(riskIndex, riskFactorsCache, userLocation);
  else document.getElementById('gpsStatus').textContent = t('gpsLocating');
}

function intensityColor(i){if(i>=9)return"#991b1b";if(i>=7)return"#ef4444";if(i>=5)return"#f97316";if(i>=3)return"#fbbf24";return"#4ade80";}

function countryFillColor(name){
  const r=COUNTRY_RISK[name];if(!r)return"rgba(34,197,94,0.04)";
  const a=Math.min(r/10,1);
  if(r>=8)return`rgba(153,27,27,${a*0.7})`;if(r>=6)return`rgba(239,68,68,${a*0.5})`;
  if(r>=4)return`rgba(249,115,22,${a*0.35})`;return`rgba(251,191,36,${a*0.2})`;
}

function renderLegend(){
  const items=[
    {color:"#991b1b",label:t('legendWar')},{color:"#ef4444",label:t('legendHigh')},
    {color:"#f97316",label:t('legendMedium')},{color:"#fbbf24",label:t('legendLow')},{color:"#4ade80",label:t('legendGeo')}
  ];
  document.getElementById('mapLegend').innerHTML=items.map(i=>`<div class="legend-item"><div class="legend-dot" style="background:${i.color}"></div>${i.label}</div>`).join('');
}

// ====== MAP RENDERING ======
function initMap(){
  document.title=t('pageTitle');
  document.documentElement.lang=lang==='zh'?'zh-CN':'en';
  updateLangSwitcher();
  updateMapPageText();

  const tooltip=document.getElementById("conflictTooltip");
  const width=960,height=500;
  const svg=d3.select("#worldMap").append("svg").attr("viewBox",`0 0 ${width} ${height}`).style("background","transparent");
  const projection=d3.geoNaturalEarth1().scale(153).translate([width/2,height/2]);
  const path=d3.geoPath().projection(projection);

  fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
    .then(r=>r.json())
    .then(world=>{
      const countries=topojson.feature(world,world.objects.countries);
      window._countries=countries;
      svg.append("g").selectAll("path").data(countries.features).enter().append("path")
        .attr("d",path)
        .attr("fill",d=>{const n=d.properties&&d.properties.name?d.properties.name:"";return countryFillColor(n);})
        .attr("stroke",d=>{
          const n=d.properties&&d.properties.name?d.properties.name:"";
          const r=COUNTRY_RISK[n];
          if(!r)return"rgba(34,197,94,0.35)";if(r>=7)return"rgba(239,68,68,0.25)";if(r>=4)return"rgba(249,115,22,0.18)";return"rgba(251,191,36,0.12)";
        })
        .attr("stroke-width",d=>{const n=d.properties&&d.properties.name?d.properties.name:"";return COUNTRY_RISK[n]?0.5:0.8;});

      CONFLICTS.forEach(c=>{
        const [x,y]=projection([c.lon,c.lat]);if(!x||!y)return;
        const g=svg.append("g").attr("class","hotspot-marker");
        g.append("circle").attr("class","hotspot-ring").attr("cx",x).attr("cy",y).attr("r",6).attr("fill","none").attr("stroke",intensityColor(c.intensity)).attr("stroke-width",1.5).attr("opacity",0.5);
        g.append("circle").attr("cx",x).attr("cy",y).attr("r",Math.max(2,c.intensity*0.5)).attr("fill",intensityColor(c.intensity)).attr("opacity",0.9);
        g.on("mouseenter",e=>{
          tooltip.innerHTML=`<div class="ct-name">${c.name}</div><div class="ct-level" style="color:${intensityColor(c.intensity)}">● ${c.type} · ${t('tooltipLevel')} ${c.intensity}/10</div><div class="ct-desc">${c.desc}</div>`;
          tooltip.style.opacity=1;tooltip.style.left=(e.clientX+12)+"px";tooltip.style.top=(e.clientY-10)+"px";
        }).on("mouseleave",()=>{tooltip.style.opacity=0;}).on("click",()=>{openSourcePanel(c);});
      });

      window._projection=projection;window._svg=svg;
      requestGPS();
    }).catch(()=>{
      document.getElementById("worldMap").innerHTML='<div style="text-align:center;color:#555;padding:40px">Loading map...</div>';
      requestGPS();
    });
}

// ====== GPS & RISK ======
let userLocation=null,riskIndex=null,riskFactorsCache=[];

function requestGPS(){
  const el=document.getElementById("gpsStatus");
  el.textContent=t('gpsLocating');
  if(!navigator.geolocation){el.textContent=t('gpsNoSupport');calculateRisk(null);return;}
  navigator.geolocation.getCurrentPosition(
    pos=>{
      userLocation={lat:pos.coords.latitude,lon:pos.coords.longitude};
      let userCountryName="";
      if(window._countries){
        const uf=window._countries.features.find(f=>d3.geoContains(f,[userLocation.lon,userLocation.lat]));
        userCountryName=uf&&uf.properties?uf.properties.name:"";
        window._userCountry=userCountryName;
      }
      const latDir=userLocation.lat>=0?"N":"S";
      const lonDir=userLocation.lon>=0?"E":"W";
      el.innerHTML=`<span class="pin">📍</span> ${userCountryName?userCountryName+" · ":""}${Math.abs(userLocation.lat).toFixed(2)}°${latDir}, ${Math.abs(userLocation.lon).toFixed(2)}°${lonDir}`;
      if(window._projection&&window._svg){
        const[ux,uy]=window._projection([userLocation.lon,userLocation.lat]);
        if(ux&&uy){
          const g=window._svg.append("g").attr("class","user-marker");
          g.append("circle").attr("cx",ux).attr("cy",uy).attr("r",8).attr("fill","rgba(34,197,94,.2)");
          g.append("circle").attr("cx",ux).attr("cy",uy).attr("r",4).attr("fill","#22c55e");
          g.append("circle").attr("cx",ux).attr("cy",uy).attr("r",2).attr("fill","#fff");
          g.style("cursor","pointer");
          g.on("mouseenter",e=>{
            const tooltip=document.getElementById("conflictTooltip");
            tooltip.innerHTML=`<div class="ct-name">${userCountryName||t('gpsYourLocation')}</div><div class="ct-desc" style="color:#22c55e">📍 ${t('gpsYourLocation')}</div>`;
            tooltip.style.opacity=1;tooltip.style.left=(e.clientX+12)+"px";tooltip.style.top=(e.clientY-10)+"px";
          }).on("mouseleave",()=>{document.getElementById("conflictTooltip").style.opacity=0;});
        }
      }
      calculateRisk(userLocation);
      initVisitorCounter();
    },
    err=>{console.warn("GPS:",err);document.getElementById("gpsStatus").textContent=t('gpsError');calculateRisk(null);initVisitorCounter();},
    {enableHighAccuracy:false,timeout:8000,maximumAge:600000}
  );
}

function haversine(lat1,lon1,lat2,lon2){
  const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function calculateRisk(loc){
  let factors=[],score=0;
  if(!loc){
    score=5.2;factors=[...t('globalFactors')];
  } else {
    let ps=0,near=[];
    CONFLICTS.forEach(c=>{
      const d=haversine(loc.lat,loc.lon,c.lat,c.lon);
      let w=0;if(d<500)w=c.intensity*1.0;else if(d<1500)w=c.intensity*0.6;else if(d<3000)w=c.intensity*0.3;else if(d<6000)w=c.intensity*0.1;else w=c.intensity*0.03;
      ps+=w;if(d<3000)near.push({...c,dist:Math.round(d)});
    });
    score=Math.min(10,Math.max(1,ps/8));score=Math.round(score*10)/10;
    near.sort((a,b)=>a.dist-b.dist);near.slice(0,3).forEach(c=>factors.push(`${c.name} (${c.dist}km)`));
    factors.push(t('globalPressure'));if(score>=6)factors.push(t('riskSuggestMore'));
  }
  riskFactorsCache=factors;
  displayRisk(score,factors,loc);
}

function displayRisk(score,factors,loc){
  riskIndex=score;
  const scoreEl=document.getElementById("riskScore"),descEl=document.getElementById("riskDesc");
  const factorsEl=document.getElementById("riskFactors"),btnEl=document.getElementById("enterCalcBtn");
  let color,desc,btnBg;
  if(score>=8){color="#991b1b";desc=t('riskExtreme');btnBg="linear-gradient(135deg,#991b1b,#7f1d1d)";}
  else if(score>=6){color="#ef4444";desc=t('riskHigh');btnBg="linear-gradient(135deg,#dc2626,#991b1b)";}
  else if(score>=4){color="#f97316";desc=t('riskMedium');btnBg="linear-gradient(135deg,#ea580c,#c2410c)";}
  else{color="#fbbf24";desc=t('riskSafe');btnBg="linear-gradient(135deg,#d97706,#b45309)";}
  scoreEl.textContent=score.toFixed(1);scoreEl.style.color=color;descEl.textContent=desc;
  factorsEl.innerHTML=factors.map(f=>`<span class="risk-factor">${f}</span>`).join("");
  btnEl.textContent=t('enterCalcBtn');btnEl.style.background=btnBg;btnEl.style.display="block";
}

let calcState={step:1,members:[{id:1,label:"",age:40,weight:70,gender:"m",special:""}],nextId:2,region:"island_import",housing:"house",petType:"none",petWeight:30,vehicles:1,months:6,country:""};

function calcCal(age,weight,gender,special){
  if(age>=10&&age<=17)return Math.round(weight*42);
  if(special==="pregnant")return Math.round(weight*(gender==="f"?25:30)*1.3+300);
  if(gender==="m")return Math.round(weight*30*1.3);
  return Math.round(weight*25*1.3);
}

function calcPet(type,weight){
  if(type==="none")return{daily:0,monthly:0,cost6mo:0,label:""};
  if(type==="cat")return{daily:60,monthly:1.8,cost6mo:120,label:t('iCatFood'),bagSize:4};
  const d=Math.round(weight*0.025*1000*0.35+weight*3),m=Math.round(d*30/1000*10)/10;
  const cpk=type==="dog_large"?4.5:type==="dog_medium"?5:6,bs=type==="dog_large"?15:10;
  return{daily:d,monthly:m,cost6mo:Math.round(m*6*cpk),label:t('iDogFood'),bagSize:bs};
}

function generate(){
  const s=calcState,n=s.members.length;
  const cp=s.country?COUNTRY_PROFILES[s.country]:null;
  const currSymbol=cp?cp.symbol:'$';
  const currRate=cp?cp.rate:1;
  const RDATA=t('regions'),HDATA=t('housings');
  const reg=RDATA.find(r=>r.id===s.region)||RDATA[0],hou=HDATA.find(h=>h.id===s.housing)||HDATA[0];
  const pet=calcPet(s.petType,s.petWeight);
  const md=s.members.map(m=>({...m,cal:calcCal(m.age,m.weight,m.gender,m.special),isGrowing:m.age>=10&&m.age<=17}));
  const totalCal=md.reduce((a,m)=>a+m.cal,0),waterL=n*3*7;
  const gkd=Math.round(totalCal*0.55/3500*10)/10,grainKg=Math.round(gkd*Math.min(s.months,3)*30);
  const stapleRatio=cp?cp.staples:{rice:0.65,pasta:0.20,flour:0.10,oat:0.05};
  const riceKg=Math.round(grainKg*stapleRatio.rice),riceBags=Math.ceil(riceKg/10);
  const noodleKg=Math.round(grainKg*stapleRatio.pasta),noodlePacks=Math.ceil(noodleKg/0.5);
  const flourBags=Math.ceil(Math.round(grainKg*stapleRatio.flour)/1.5),oatBags=Math.max(Math.ceil(Math.round(grainKg*stapleRatio.oat)/1),2);
  const protCans=Math.round(n*2*Math.min(s.months,2)*4.3);
  const protRatio=cp?cp.proteins:{tuna:0.40,beans:0.35,meat:0.25};
  const tunaCans=Math.round(protCans*(protRatio.tuna||0.4)),beanCans=Math.round(protCans*(protRatio.beans||0.35)),tomCans=Math.round(protCans*(1-(protRatio.tuna||0.4)-(protRatio.beans||0.35)));
  const meatCans=Math.max(Math.round(n*1.5*Math.min(s.months,2)),6);
  const chickenP=Math.ceil(Math.round(n*0.5*Math.min(s.months,2)*4.3)),beefP=Math.ceil(Math.round(n*0.3*Math.min(s.months,2)*4.3)/0.5);
  const oilB=Math.max(Math.ceil(n*0.5*Math.min(s.months,3)),3),frzVeg=Math.round(n*1*Math.min(s.months,2)*4.3/4);
  const cashBase=n*300,hasGrowing=md.some(m=>m.isGrowing),hasElderly=md.some(m=>m.special==="elderly"||m.age>=65);
  const femaleCount=md.filter(m=>m.gender==="f"&&m.age>=12).length,fuelExtra=reg.fuelRisk>=2&&s.vehicles>0;

  const B=t('uBag'),Bt=t('uBottle'),Bx=t('uBox'),Pk=t('uPack'),Cn=t('uCan'),Pg=t('uPkg'),Tr=t('uTray'),Un=t('uUnit');
  const urgent=[],important=[],general=[];

  urgent.push({n:t('iWater10L'),q:`${Math.ceil(waterL/10)} ${Bt}`,c:Math.ceil(waterL/10)*8,r:t('rWater')(n,waterL)});
  urgent.push({n:t('iWaterPurif'),q:`2 ${Bx}`,c:50,r:t('rWaterPurif')});
  urgent.push({n:t('iRice10kg'),q:`${riceBags} ${B}`,c:riceBags*18,r:t('rRice')(riceKg,Math.min(s.months,3))});
  urgent.push({n:t('iPasta'),q:`${noodlePacks} ${Pk}`,c:Math.round(noodlePacks*2.5),r:t('rPasta')(noodleKg)});
  urgent.push({n:t('iFlour'),q:`${flourBags} ${B}`,c:flourBags*3,r:t('rFlour')});
  urgent.push({n:t('iOatmeal'),q:`${oatBags} ${B}`,c:oatBags*5,r:t('rOatmeal')});
  urgent.push({n:t('iOil'),q:`${oilB} ${Bt}`,c:oilB*9,r:t('rOil')(n,Math.round(n*0.5))});
  urgent.push({n:t('iTuna'),q:`${tunaCans} ${Cn}`,c:tunaCans*2,r:t('rTuna')});
  urgent.push({n:t('iBeans'),q:`${beanCans} ${Cn}`,c:beanCans*2,r:t('rBeans')});
  urgent.push({n:t('iTomato'),q:`${tomCans} ${Cn}`,c:Math.round(tomCans*1.5),r:t('rTomato')});
  urgent.push({n:t('iMeat'),q:`${meatCans} ${Cn}`,c:meatCans*5,r:t('rMeat')});
  urgent.push({n:t('iChicken'),q:`${chickenP} ${Pg}`,c:chickenP*12,r:t('rChicken')});
  urgent.push({n:t('iBeef'),q:`${beefP} ${Pg}`,c:beefP*9,r:t('rBeef')});
  if(hasGrowing){
    const gt=md.filter(m=>m.isGrowing).length;
    urgent.push({n:t('iEggs'),q:`${Math.max(gt*2,2)} ${Tr}`,c:Math.max(gt*2,2)*14,r:t('rEggs')});
    urgent.push({n:t('iMilk'),q:`${Math.max(gt*12,12)} ${Bx}`,c:Math.round(Math.max(gt*12,12)*2.5),r:t('rMilk')});
  }
  const medK=Math.max(Math.ceil(n/2),2);
  urgent.push({n:t('iFirstAid'),q:`${medK} ${Un}`,c:medK*35,r:t('rFirstAid')});
  const chronic=md.filter(m=>m.special==="chronic").length;
  if(chronic>0)urgent.push({n:t('iRx'),q:t('uAsNeeded'),c:chronic*50,r:t('rRx')});
  if(pet.daily>0){
    const petKg6=Math.round(pet.monthly*s.months),bags=Math.ceil(petKg6/pet.bagSize);
    urgent.push({n:`${pet.label} ${pet.bagSize}kg`,q:`${bags} ${B}`,c:pet.cost6mo,r:t('rPetDry')(pet.daily,s.months,petKg6)});
    const wetLabel=pet.label===t('iCatFood')?t('iCatWet'):t('iDogWet');
    urgent.push({n:wetLabel,q:`${Math.round(s.months*4)} ${Cn}`,c:Math.round(s.months*4*3.5),r:t('rPetWet')});
  }
  urgent.push({n:t('iCash'),q:`$${cashBase.toLocaleString()}`,c:cashBase,r:t('rCash')(n)});

  important.push({n:t('iSeasoning'),q:`${n}${t('uPeople')}`,c:Math.round(25+n*8),r:t('rSeasoning')});
  important.push({n:t('iHoney'),q:`${Math.max(Math.ceil(n/2),2)} ${Cn}`,c:Math.max(Math.ceil(n/2),2)*12,r:t('rHoney')});
  important.push({n:t('iMilkPowder'),q:`${Math.max(Math.ceil(n/2),2)} ${Cn}`,c:Math.max(Math.ceil(n/2),2)*16,r:t('rMilkPowder')});
  important.push({n:t('iDriedBeans'),q:`${Math.max(n,3)} ${B}`,c:Math.max(n,3)*5,r:t('rDriedBeans')});
  important.push({n:t('iDriedGoods'),q:`3-5 ${Pk}`,c:Math.round(n*6),r:t('rDriedGoods')});
  important.push({n:t('iNuts'),q:`${Math.ceil(n/2)} ${B}`,c:Math.ceil(n/2)*15,r:t('rNuts')});
  important.push({n:t('iFrzVeg'),q:`${frzVeg} ${B}`,c:frzVeg*5,r:t('rFrzVeg')(n)});
  important.push({n:t('iFrzEdamame'),q:`${Math.round(n*1.5)} ${B}`,c:Math.round(n*1.5)*4,r:t('rFrzEdamame')});
  if(fuelExtra)important.push({n:t('iFuelTank'),q:`${s.vehicles}`,c:s.vehicles*80,r:t('rFuelTank')});
  const tpQ=Math.max(Math.ceil(n*0.8*Math.min(s.months,3)/3),3);
  important.push({n:t('iToiletPaper'),q:`${tpQ} ${t('uPkg')}`,c:tpQ*12,r:t('rToiletPaper')(n,Math.min(s.months,3))});
  important.push({n:t('iCleaning'),q:`3mo`,c:Math.round(15+n*5),r:t('rCleaning')});
  important.push({n:t('iPersonalCare'),q:`${n}${t('uPeople')}×3mo`,c:Math.round(n*12),r:t('rPersonalCare')});
  if(femaleCount>0)important.push({n:t('iFemHygiene'),q:`${femaleCount}×3mo`,c:femaleCount*25,r:t('rFemHygiene')});
  if(pet.daily>0)important.push({n:t('iPetPrevMed'),q:`${s.months}mo`,c:Math.round(s.months*15),r:t('rPetPrevMed')});
  important.push({n:t('iGasBurner'),q:t('uSet'),c:Math.round(50+n*5),r:t('rGasBurner')});
  important.push({n:t('iPowerBank'),q:`${Math.max(Math.ceil(n/3),1)} ${Un}`,c:Math.max(Math.ceil(n/3),1)*50,r:t('rPowerBank')});
  important.push({n:t('iBatteries'),q:t('uSet'),c:35,r:t('rBatteries')});

  general.push({n:t('iVitamins'),q:`${Math.ceil(n*0.7)} ${Bt}`,c:Math.ceil(n*0.7)*15,r:t('rVitamins')});
  if(hasElderly){const ec=md.filter(m=>m.special==="elderly"||m.age>=55).length;general.push({n:t('iCalcium'),q:`${ec} ${Bt}`,c:ec*12,r:t('rCalcium')});}
  general.push({n:t('iCoffee'),q:`2-3mo`,c:Math.round(30+n*12),r:t('rCoffee')});
  if(hou.gardenOk)general.push({n:t('iGardenKit'),q:t('uSet'),c:30,r:t('rGardenKit')});
  general.push({n:t('iRadio'),q:`1 ${Un}`,c:40,r:t('rRadio')});
  general.push({n:t('iDocPouch'),q:`${Math.ceil(n/3)} ${t('uPcs')}`,c:Math.ceil(n/3)*10,r:t('rDocPouch')});
  if(pet.daily>0)general.push({n:t('iPetEmergency'),q:t('uSet'),c:80,r:t('rPetEmergency')});
  general.push({n:t('iInsurance'),q:"—",c:0,r:t('rInsurance')});

  // Add cultural items from country profile
  if(cp&&cp.culturalItems){
    cp.culturalItems.forEach(ci=>{
      const itemName=lang==='zh'?ci.zh:ci.en;
      const itemR=typeof ci.r==='object'?(lang==='zh'?ci.r.zh:ci.r.en):ci.r;
      const qty=Math.max(Math.ceil(ci.q*n/2),ci.q);
      const cost=Math.round(qty*ci.c);
      important.push({n:itemName,q:`${qty}`,c:cost,r:itemR});
    });
  }

  // Apply currency conversion
  if(cp&&cp.rate!==1){
    [urgent,important,general].forEach(tier=>{
      tier.forEach(item=>{item.c=Math.round(item.c*currRate);});
    });
  }

  const ut=urgent.reduce((a,i)=>a+i.c,0),it=important.reduce((a,i)=>a+i.c,0),gt=general.reduce((a,i)=>a+i.c,0);
  return{md,totalCal,waterL,grainKg,pet,urgent,important,general,ut,it,gt,total:ut+it+gt,currSymbol};
}

  <div class="radio-grid" id="regionGrid">${regionsHTML}</div>
  <div class="inline-fields" style="margin-top:12px">
  <div class="inline-field"><label>${t('labelHousing')}</label><select id="housing">${housingOpts}</select></div>
  <div class="inline-field"><label>${t('labelVehicles')}</label><select id="vehicles">${vehOpts}</select></div>
  <div class="inline-field"><label>${t('labelPeriod')}</label><select id="months">${moOpts}</select></div>
  </div></div></div>
  <button class="btn btn-primary" id="generateBtn">${t('generateBtn')}</button>
  <div class="footer">${t('calcFooter')}</div>`;
}

function renderResult(){
  const r=generate();
  const pu=t('uPeople'),pd=t('perDay'),au=t('ageUnit');
  const memberTags=r.md.map(m=>`<span class="member-tag">${m.label||t('memberDefault')+m.id} ${m.age}${au}/${m.weight}kg → ${m.cal.toLocaleString()}kcal${pd}</span>`).join("");
  const petTag=r.pet.daily>0?`<span class="member-tag pet">${lang==='zh'?'宠物':'Pet'} → ${r.pet.daily}g${pd}</span>`:"";
  const petSfx=calcState.petType!=="none"?t('petSuffix'):"";
  const planTitle=lang==='zh'?`${calcState.members.length}${t('planPeopleSuffix')}${petSfx}·${calcState.months}${t('planMonthSuffix')}`:`${calcState.members.length} ${t('planPeopleSuffix')}${petSfx} · ${calcState.months}${t('planMonthSuffix')}`;
  const rc=riskIndex!==null?(riskIndex>=7?'#ef4444':riskIndex>=4?'#f97316':'#fbbf24'):'#fbbf24';

  function tierHTML(items,title,tag){
    const total=items.reduce((a,i)=>a+i.c,0);
    const rows=items.map(i=>`<tr><td>${i.n}</td><td>${i.q}</td><td>${r.currSymbol}${i.c.toLocaleString()}</td><td>${i.r}</td></tr>`).join("");
    return`<div class="tier-section"><div class="tier-header"><span class="tier-tag ${tag}">${title}</span><span class="tier-total">${r.currSymbol}${total.toLocaleString()}</span></div><table class="item-table"><thead><tr><th>${t('thItem')}</th><th>${t('thQty')}</th><th>${t('thCost')}</th><th>${t('thRationale')}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  return`
  <div class="risk-banner">
    <div class="rb-score" style="color:${rc}">${riskIndex!==null?riskIndex.toFixed(1):'—'}</div>
    <div class="rb-text"><strong>${t('riskIndex')}</strong><br>${userLocation?t('basedOnGPS'):t('globalAvg')}</div>
    <button class="rb-back" onclick="backToMap()">${t('backToMap')}</button>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
  <h2 style="font-size:17px">${planTitle}</h2>
  <button class="btn btn-sm" id="backBtn">${t('editParams')}</button>
  </div>
  <div class="member-tags">${memberTags}${petTag}</div>
  <div class="summary-grid">
  <div class="summary-card"><div class="sc-label">${t('labelDailyCal')}</div><div class="sc-value">${r.totalCal.toLocaleString()}</div><div class="sc-sub">kcal · ${calcState.members.length} ${pu}</div></div>
  <div class="summary-card"><div class="sc-label">${t('labelGrain')}</div><div class="sc-value">${r.grainKg}kg</div><div class="sc-sub">${t('grainSubPrefix')} ${Math.min(calcState.months,3)} ${t('grainSubSuffix')}</div></div>
  <div class="summary-card"><div class="sc-label">${t('labelWater')}</div><div class="sc-value">${r.waterL}L</div><div class="sc-sub">${calcState.members.length} ${pu} ${t('waterSubSuffix')}</div></div>
  <div class="summary-card"><div class="sc-label">${t('labelBudget')}</div><div class="sc-value" style="color:#c53030">${r.currSymbol}${r.total.toLocaleString()}</div><div class="sc-sub">${t('budgetSub')}</div></div>
  </div>
  ${tierHTML(r.urgent,t('tierUrgent'),"red")}
  ${tierHTML(r.important,t('tierImportant'),"amber")}
  ${tierHTML(r.general,t('tierGeneral'),"blue")}
  <div class="grand-total"><div class="gt-grid">
  <div><div class="gt-label">${t('totalUrgent')}</div><div class="gt-value">${r.currSymbol}${r.ut.toLocaleString()}</div></div>
  <div><div class="gt-label">${t('totalImportant')}</div><div class="gt-value">${r.currSymbol}${r.it.toLocaleString()}</div></div>
  <div><div class="gt-label">${t('totalGeneral')}</div><div class="gt-value">${r.currSymbol}${r.gt.toLocaleString()}</div></div>
  <div><div class="gt-label" style="color:#c53030;font-weight:600">${t('totalLabel')}</div><div class="gt-value gt-highlight">${r.currSymbol}${r.total.toLocaleString()}</div></div>
  </div></div>
  <div class="notes">${t('notesText')}</div>
  <button class="btn back-btn" id="backBtn2">${t('backBtn')}</button>
  <div class="footer">${t('calcFooterResult')}</div>`;
}

function bindEvents(){
  const s=calcState;
  document.querySelectorAll(".member-grid[data-mid]").forEach(row=>{
    const mid=+row.dataset.mid;
    row.querySelectorAll("input,select").forEach(el=>{
      const f=el.dataset.field;if(!f)return;
      el.addEventListener("change",()=>{const m=s.members.find(x=>x.id===mid);if(m){m[f]=el.type==="number"?+el.value:el.value;renderCalc();}});
    });
  });
  document.querySelectorAll("[data-remove]").forEach(b=>{b.addEventListener("click",()=>{s.members=s.members.filter(m=>m.id!==+b.dataset.remove);renderCalc();});});
  const addBtn=document.getElementById("addMember");
  if(addBtn)addBtn.addEventListener("click",()=>{s.members.push({id:s.nextId++,label:"",age:30,weight:60,gender:"m",special:""});renderCalc();});
  const petSel=document.getElementById("petType");
  if(petSel)petSel.addEventListener("change",()=>{s.petType=petSel.value;renderCalc();});
  const pwEl=document.getElementById("petWeight");
  if(pwEl)pwEl.addEventListener("change",()=>{s.petWeight=+pwEl.value;renderCalc();});
  const countrySel=document.getElementById("countrySelect");
  if(countrySel)countrySel.addEventListener("change",()=>{
    s.country=countrySel.value;
    if(s.country&&COUNTRY_PROFILES[s.country]){
      s.region=COUNTRY_PROFILES[s.country].region;
    }
    renderCalc();
  });
  document.querySelectorAll("[data-region]").forEach(card=>{card.addEventListener("click",()=>{s.region=card.dataset.region;renderCalc();});});
  ["housing","vehicles","months"].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener("change",()=>{s[id]=id==="housing"?el.value:+el.value;renderCalc();});});
  const genBtn=document.getElementById("generateBtn");
  if(genBtn)genBtn.addEventListener("click",()=>{s.step=2;renderCalc();window.scrollTo(0,0);});
  [document.getElementById("backBtn"),document.getElementById("backBtn2")].forEach(b=>{if(b)b.addEventListener("click",()=>{s.step=1;renderCalc();window.scrollTo(0,0);});});
}

// ====== SOURCE PANEL ======
function openSourcePanel(c){
  const panel=document.getElementById("sourcePanel");
  const linksHTML=(c.sources||[]).map(s=>`<a class="sp-link" href="${s.url}" target="_blank" rel="noopener">${s.title}<span class="sp-link-arrow">↗</span></a>`).join("");
  document.getElementById("sourcePanelContent").innerHTML=`
    <div class="sp-name">${c.name}</div>
    <div class="sp-type" style="color:${intensityColor(c.intensity)}">● ${c.type} · ${t('tooltipLevel')} ${c.intensity}/10</div>
    <div class="sp-desc">${c.desc}</div>
    <div class="sp-sources-title">${t('sourcesTitle')}</div>
    ${linksHTML}`;
  panel.classList.add("open");
}
function closeSourcePanel(){document.getElementById("sourcePanel").classList.remove("open");}
document.getElementById("mapPage").addEventListener("click",e=>{
  if(!e.target.closest(".source-panel")&&!e.target.closest(".hotspot-marker"))closeSourcePanel();
});

// ====== INIT ======
document.addEventListener("DOMContentLoaded",initMap);
</script>
</body></html>
